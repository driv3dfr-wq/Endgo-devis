const SCH_VUES = [["iso","Vue habillée"],["eco","Écorché ossature"],["bout","Vue en bout cotée"]];
/* Paramètres du schéma tirés de l’ouvrage, puis réglages propres au schéma (o.sch) par-dessus. */
function schFromOuv(o){
  const d = o.d, Q = quantities(o), ref = k => { const x = (o.sec.ossature || []).find(y => y.tpl === k && !y.off); return x && has(x.ref) ? String(x.ref).trim() : ""; };
  const P = {titre:o.name, L:d.L, l:d.l, toit:d.toit, H:d.H, hA:d.Hav, hB:d.Har, pente:d.pente, deb:d.deb, n:Q.nbPortiques, entPort:d.entPort, entPannes:d.entPannes, entLisses:d.entLisses, potelets:d.potelets, nbEP:d.nbEP,
    ouv:(o.ouv || []).map(x => ({type:x.type, w:x.w, h:x.h, q:x.q, cote:x.cote || "avant"})), poteau:ref("Poteaux"), membrure:ref("Traverses / arbalétriers"), pannesSec:ref("Pannes"), lissesSec:ref("Lisses de bardage")};
  const h = (o.hauvents || [])[0];
  if(h && num(h.l) > 0) P.auvent = {cote:h.cote || "arriere", p:h.l, pente:h.pente, L:h.L, poteaux:false};
  const tr = activeLines(o).lines.find(x => /translucide|éclairant|eclairant/i.test(lineLabel(x.L)) && x.c.qty > 0);
  if(tr){ const ramp = num(d.l) * (d.toit === "2p" ? 0.5 : 1) * 1.01; P.ecl = Math.max(1, Math.round(tr.c.qty / Math.max(1, 1.1 * ramp * 0.75))); }
  const s = o.sch || {};
  Object.keys(s).forEach(k => { if(k === "auvent"){ P.auvent = s.auvent ? Object.assign({}, P.auvent || {}, s.auvent) : null; } else if(has(s[k])) P[k] = s[k]; });
  return P;
}
function schTitre(P, o){ return (o ? o.name : P.titre || "Bâtiment"); }

async function schToDrive(pngs, cl, name){

/* Poids au mètre d’un profil ou d’un tube écrit en clair (catalogue, sinon calcul à partir des dimensions, acier 7,85 kg/dm³). */
function kgmOf(sec){
  if(!has(sec)) return 0;

function pdfNorm(t){ return String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim(); }

const PDF_GROUP_RULES = [

  [/grue|nacelle|levage|chariot [eé]l[eé]vateur/i, "commun", "Levage : grue, nacelle, chariot"],
  [/[eé]tude|plans?\b|note de calcul/i, "commun", "Études / plans / note de calcul"],
  [/fondation|massif|prescellement|scellement/i, "commun", null],
  [/panneau.*(frigo|isotherme)|chambre froide/i, "froid", null],
  [/garde[- ]corps|main courante/i, "gc", null],
  [/escalier/i, "escalier", null],
  [/portail|cl[oô]ture|portillon/i, "portail", null],
  [/porte|fen[eê]tre|ch[aâ]ssis|rideau/i, "ouvertures", null],
  [/armature.*bardage|lisse|potelet/i, "ossature", null],

  [/ch[eé]neau|goutti[eè]re|descente|fa[iî]tag|rive|closoir|bac acier|couverture|t[oô]le|translucide/i, "couverture", null],
  [/charpente|poteau|traverse|panne|[eé]clisse|poutre|contreventement|ossature|portique|ipe|hea|heb/i, "ossature", null]

function pdfGuessType(r){

    return couv && bard ? "complet" : couv ? "oss_couv" : bard && !nc ? "oss_bard" : "ossature";

  if(/bac acier|couverture/i.test(t)) return "couv";
  if(/bardage/i.test(t)) return "bard";
  if(/garde[- ]corps/i.test(t)) return "gc";

function pdfSecs(type){ return TYPES[type].sections.filter(k => k!=="ouvertures" || type==="bard" || type==="complet" || type==="oss_bard"); }
function pdfFixGroup(g, type){

/* Poste proposé pour une ligne : mémoire des imports, puis mots-clés, puis nouveau poste */
function pdfSuggest(l, type){
  const key = pdfNorm(l.designation);
  const mem = (DB.pdfMap||{})[key];
  if(mem && pdfSecs(type).includes(mem.g) && catItems(mem.g).some(x => x.label===mem.label)) return "p|" + mem.g + "|" + mem.label;
  const all = l.designation + " " + (l.details||[]).join(" ");

  for(const [re, gg, ll] of PDF_GROUP_RULES){ if(re.test(l.designation) || (!g && re.test(all))){ g = gg; lab = ll; if(re.test(l.designation)) break; } }
  g = pdfFixGroup(g || "", type);
  if(lab && g==="commun" && catItems("commun").some(x => x.label===lab)) return "p|commun|" + lab;
  const words = key.split(" ").filter(w => w.length > 2);

async function pdfOpenFile(f){
  if(f.size > 25*1024*1024) return toast("PDF trop lourd (plus de 25 Mo)");
  toast("Lecture du PDF…");
  const buf = await f.arrayBuffer();
  const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(new Blob([buf], {type:"application/pdf"})); });

    if(has(l.ref) && !has(ln.ref)) ln.ref = l.ref;
    const ckey = g + "|" + (ln.tpl || ln.label);

  DB.devis.push(dv); DB.ui.devisId = dv.id; DB.ui.tab = "devis";
  saveNow(); render(); window.scrollTo(0,0);

async function syncMediaUp(){

  for(const m of mediaList()){
    if(SYNC.media[m.name]===m.rev) continue;
    const v = await MEDIA.get(m.k); if(!v) continue;

      await syncCall({action:"putMedia", name:m.name, data:"data:application/json;base64," + b64(JSON.stringify(v)), desc:m.desc, client:m.client, sub:m.sub});
      if(v.png) await syncCall({action:"putMedia", name:m.name.replace(".json",".jpg"), data:v.png, desc:m.desc, client:m.client, sub:m.sub});
    } else await syncCall({action:"putMedia", name:m.name, data:v, desc:m.desc, client:m.client, sub:m.sub});
    SYNC.media[m.name] = m.rev; syncStore();
  }
}
async function syncMediaDown(){
  SYNC.media = SYNC.media || {};
  for(const m of mediaList()){
    const have = await MEDIA.get(m.k);
    if(have && SYNC.media[m.name]===m.rev) continue;
    const r = await syncCall({action:"getMedia", name:m.name, client:m.client, sub:m.sub}); if(!r || !r.ok) continue;
    await MEDIA.put(m.k, m.k.startsWith("sk_") ? JSON.parse(unb64(r.data.split(",")[1])) : r.data);

  }
}

/* V3 : fusion automatique. On garde une copie de la dernière version synchronisée (base) ; pour chaque client, devis
   et réglage, on prend le côté qui a changé depuis cette base. On ne demande que si la MÊME fiche a changé des deux côtés. */
const BASE_KEY = "endgo_sync_base_v3";

function baseGet(){ try{ return JSON.parse(localStorage.getItem(BASE_KEY) || "null"); }catch(e){ return null; } }
function syncMerge(L, R, B){
  B = B || {}; const out = {}, conf = [], J = x => x === undefined ? "∅" : JSON.stringify(x);
  const pick = (l, r, b) => { const jl = J(l), jr = J(r), jb = J(b); if(jl === jr || jr === jb) return {v:l}; if(jl === jb) return {v:r}; return {conf:true}; };
  new Set(Object.keys(L).concat(Object.keys(R))).forEach(k => {
    if(k === "clients" || k === "devis"){
      const map = a => new Map((a || []).map(x => [x.id, x])), ml = map(L[k]), mr = map(R[k]), mb = map(B[k]);
      const ids = [...new Set((L[k] || []).map(x => x.id).concat((R[k] || []).map(x => x.id)))], arr = [];
      ids.forEach(id => { const p = pick(ml.get(id), mr.get(id), mb.get(id));
        if(p.conf){ conf.push({k, id, l:ml.get(id), r:mr.get(id)}); arr.push({__c:conf.length - 1}); } else if(p.v !== undefined) arr.push(p.v); });
      out[k] = arr;
    } else if(k === "seq"){
      out.seq = Object.assign({}, R.seq || {}, L.seq || {});
      Object.keys(R.seq || {}).forEach(y => out.seq[y] = Math.max(+((L.seq || {})[y] || 0), +(R.seq[y] || 0)));
    } else { const p = pick(L[k], R[k], B[k]); if(p.conf){ conf.push({k, l:L[k], r:R[k]}); out[k] = {__c:conf.length - 1}; } else if(p.v !== undefined) out[k] = p.v; }
  });
  return {out, conf};
}
function syncConfLabel(c){

async function syncResolve(){
  const r = await syncCall({action:"pull"});
  if(!r || !r.ok) throw new Error(r && r.err || "échec de la récupération");
  const R = r.data ? JSON.parse(r.data) : {}, L = dataPart();
  const finish = async (out) => {
    const ui = DB.ui; DB = Object.assign(blankDB(), out); DB.ui = Object.assign(blankDB().ui, ui); migrate();
    try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
    SYNC.version = r.version; syncStore();
    if(!curDevis()) DB.ui.devisId = DB.devis.length ? DB.devis[DB.devis.length-1].id : null;
    render();
    if(await syncPush(false) === "conflict") throw new Error("l’autre appareil vient encore d’envoyer, réessayez");
    await syncMediaDown(); render();
  };
  const m = syncMerge(L, R, baseGet());
  if(!m.conf.length){ await finish(m.out); syncState("Synchronisé " + hhmm()); return "merged"; }
  const fill = (side) => { const o = m.out; const put = (c) => c[side];
    ["clients","devis"].forEach(k => { if(Array.isArray(o[k])) o[k] = o[k].map(x => x && x.__c !== undefined ? put(m.conf[x.__c]) : x).filter(x => x); });
    Object.keys(o).forEach(k => { if(o[k] && o[k].__c !== undefined){ const v = put(m.conf[o[k].__c]); if(v === undefined) delete o[k]; else o[k] = v; } });
    return o; };
  const list = m.conf.map(c => "<li>" + esc(syncConfLabel(c)) + (c.l && !c.r ? " (supprimé sur l’autre appareil)" : !c.l && c.r ? " (supprimé ici)" : "") + "</li>").join("");
  modal("Même fiche modifiée sur deux appareils", `<p style="margin:0 0 8px">Tout le reste a été réuni automatiquement. Seule${m.conf.length > 1 ? "s ces fiches ont" : " cette fiche a"} été modifiée${m.conf.length > 1 ? "s" : ""} à la fois ici et sur l’autre appareil :</p><ul style="margin:0 0 8px;padding-left:20px">${list}</ul><p class="muted small" style="margin:0">« Garder celle d’ici » : la version de cet écran. « Garder celle de Google » : la version envoyée par l’autre appareil.</p>`, [
    {label:"Garder celle de Google", onClick:() => { finish(fill("r")).then(() => toast("Version de Google gardée pour ces fiches")).catch(e => toast(e.message)); }},
    {label:"Garder celle d’ici", cls:"primary", onClick:() => { finish(fill("l")).then(() => toast("Version d’ici gardée pour ces fiches")).catch(e => toast(e.message)); }}]);
  return "ask";
}
function syncConflict(){ syncBusy = true; syncResolve().catch(e => toast("Synchro Google : " + e.message)).then(() => { syncBusy = false; }); }
async function syncNow(silent){
  if(!syncOn() || syncBusy) return;
  if(!navigator.onLine){ syncState("Hors ligne : synchro plus tard"); return; }
  syncBusy = true;
  try{
    const info = await syncCall({action:"info"});
    if(!info || !info.ok) throw new Error(info && info.err || "script injoignable");
    SYNC.ia = !!info.ia; SYNC.v = info.v || 2; syncStore();
    const empty = !DB.clients.length && !DB.devis.length, localChanged = !empty && dataHash() !== SYNC.hash, remoteChanged = (info.version||"") !== (SYNC.version||"");
    if(remoteChanged && !localChanged) await syncPull();
    else if(remoteChanged && localChanged && info.version){ syncBusy = false; syncConflict(); return; }
    else if(localChanged){ if(await syncPush(false) === "conflict"){ syncBusy = false; syncConflict(); return; } }
    else { await syncMediaUp(); if(!baseGet()) baseSave(); }
    syncState("Synchronisé " + hhmm());
    drivRelever();
    if(SYNC.v >= 3 && !SYNC.range) await syncRanger();
  }catch(e){ syncState("Synchro en échec"); if(!silent) toast("Synchro Google : " + e.message); }
  syncBusy = false;
}
/* V3 : range une fois les photos, croquis et PDF déjà envoyés dans le dossier Drive de leur client */
async function syncRanger(){
  let items = [];
  mediaList().filter(m => m.client).forEach(m => { items.push({name:m.name, client:m.client, sub:m.sub}); if(m.k.startsWith("sk_")) items.push({name:m.name.replace(".json",".jpg"), client:m.client, sub:m.sub}); });

    const n = Math.min(150, items.length), r = await syncCall({action:"ranger", items:items.slice(0, n)});

}

/* ================= Liaison avec D-Riv 3D Métal (plans d'exécution) =================
   Le devis part vers D-Riv 3D par le script Google (fichier driv3d.json du dossier ENDGO Devis).
   D-Riv 3D renvoie son prix des plans, qui remplit la ligne « Études / plans / note de calcul ». */
const DRIV_ACIER = ["complet","ossature","oss_bard","oss_couv","auvent","mezz","gc","escalier","portail","metal","autre"];
const DRIV_ETUDES = "Études / plans / note de calcul";
function drivFiche(dv){

    const Q = quantities(o), P = poidsOuv(o), t = TYPES[o.type];
    let schema = "";
    if(t.geo === "bat" && num(o.d.L) > 0 && num(o.d.l) > 0){ try{ const r = schAll(schFromOuv(o)); if(!r.err) schema = r.iso; }catch(e){} }
    return {name:o.name, type:o.type, typeLabel:t.label, variant:o.variant || "", q:Q, dim:dimText(o, Q), kg:Math.round(P.kg),
      entPort:o.d.entPort, potelets:o.d.potelets, hauvents:o.hauvents || [], ouvertures:o.ouv || [],
      tubes:(o.tubes || []).map(x => ({sec:x.sec, pieces:(x.pieces || []).reduce((a, p) => a + (Math.round(num(p[1])) || 0), 0) || 1, ml:tubeCalc(x).ml})),
      profils:P.postes.filter(p => p.ref).map(p => ({label:p.nom, ref:p.ref, kg:Math.round(p.kg || 0)})), schema};
  });

/* Ligne « Études / plans » de l'ouvrage acier choisi (créée si besoin). */
function drivLine(dv){
  const ok = o => o.sec && o.sec.commun;

async function drivEnvoyer(dv){

    const r = await syncCall({action:"drivEnvoi", fiche:drivFiche(dv)});
    if(!r || !r.ok) throw new Error(r && r.err === "action inconnue" ? "le script Google n’est pas à jour" : (r && r.err) || "réponse inattendue");

/* Pose le prix reçu sur la ligne Études (sauf devis signé : il attend un clic). */
function drivAppliquer(dv, force){
  const d = dv.driv, t = drivLine(dv); if(!d || !t || !has(d.ht)) return false;
  if(dv.signature && !force){ return false; }
  const v = String(Math.round(num(d.ht) * 100) / 100).replace(".", ",");

}

    <p class="muted small" style="margin:2px 0 0">${dv.drivAff === false ? "Décoché : le prix des plans est retiré du devis (ni affiché ni compté dans le total)." : "Coché : le client voit la ligne « " + DRIV_ETUDES + " », comptée dans le total."}</p>` : ""}</div>

n ; 3 à 5 lignes claires pour un client non spécialiste (matière, sections principales, finition et RAL, pose, ce qui est compris), sans prix, sans inventer ce que tu ne sais pas (pose la question en QCM).\nCroquis : quand on t’envoie un croquis ou une photo de dessin, lis les cotes et les textes, explique en deux lignes ce que tu comprends, fais le débit complet (tubes et profilés : section, quantité × longueur ; tôles : épaisseur, quantité × dimensions ; autres pièces), et pose en QCM chaque information manquante (section, épaisseur, matière, finition, quantité). Une fois tout clair, propose l’action pour ajouter ce débit au devis (oN.tubeK… et oN.toleK…).";

      const offs = []; sectionsOf(o).forEach(sx => sx.lines.forEach(Lx => { if(Lx.data.off) offs.push("[" + iaLineRef(o, Lx) + "] " + lineLabel(Lx)); }));
      if(offs.length) L.push("   Postes désactivés : " + offs.slice(0, 40).join(" ; "));
      (o.tubes || []).forEach(t => L.push("   Tube [tube:" + t.id + "] " + (t.sec || "?") + " : " + ((t.pieces || []).filter(p => num(p[0]) > 0).map(p => p[1] + " × " + p[0] + " m").join(" ; ") || (t.ml ? t.ml + " ml" : "")) + ", barres de " + (t.bar || "6") + " m"));
    });
    const ch = dv.chantier || {};
    const chl = [];

    if((ch.croquis||[]).length) L.push("  Croquis : " + ch.croquis.map(s => s.titre).join(", "));
    if((ch.fournPdf||[]).length) L.push("  Devis fournisseurs : " + ch.fournPdf.map(p => p.fourn + (p.num ? " n° " + p.num : "") + (p.total ? " " + fmt(p.total) + " € HT" : "")).join(" ; "));

  if(IAS.meteo[c.id]) L.push("\nMétéo du chantier : " + IAS.meteo[c.id]);

}
async function iaMeteo(c){

function iaBlocks(pre, att, text){
  const b = [];
  if(pre.length) b.push({type:"text", text:pre.join("\n\n")});
  att.forEach(a => {
    if(a.kind === "wait") return;
    if(a.kind === "image") b.push({type:"image", source:{type:"base64", media_type:a.mt, data:a.data}});
    else if(a.kind === "pdf") b.push({type:"document", source:{type:"base64", media_type:"application/pdf", data:a.data}, title:a.label});
    else b.push({type:"text", text:a.data});
  });
  b.push({type:"text", text:text || "(voir la pièce jointe)"});
  return b;
}
async function iaSend(text, opt){
  opt = opt || {};

  if(!text && !IAS.att.length) return;
  if(!syncOn()){ toast("Réglez d’abord la synchronisation Google (menu ☰)"); return; }
  if(IAS.att.some(a => a.kind === "wait")){ toast("Lecture d’un fichier en cours, patientez une seconde"); return; }
  if(IAS.busy){ toast("L’IA répond encore, patientez"); return; }
  if(!iaBr() && !iaClient()){ toast("Choisissez d’abord un dossier client en haut"); return; }
  const c = iaClient();
  if(!IAS.conv){
    IAS.conv = {id:uid(), titre:"", clientId:c ? c.id : "", br:iaBr(), date:today(), cents:0};
    if(iaBr() && IAS.brCid && getClient(IAS.brCid)) IAS.conv.cid = IAS.brCid; IAS.brCid = "";
    IA.convs.push(IAS.conv); IAS.data = iaBlank();
    if(IA.convs.length > 80){ IA.convs.splice(0, IA.convs.length - 80).forEach(x => MEDIA.del("ia_" + x.id)); }
  }
  const d = IAS.data, pre = [];
  if(!d.api.length && !d.view.some(m => m.role === "user")){
    pre.push(iaCtxGeneral());
    if(IAS.conv.br) pre.push(IA_BR_CTX);
    if(IAS.conv.br && IAS.conv.cid) pre.push("[Brouillon rattaché au dossier existant de " + clientName(getClient(IAS.conv.cid)) + " : ne propose pas de nouvelle fiche client]");
    if(c){ const cx = iaCtxClient(c); pre.push("[Dossier client]\n" + cx); d.ctxHash = hashStr(cx); }
  } else if(c){
    const cx = iaCtxClient(c), h = hashStr(cx);
    if(h !== d.ctxHash){ pre.push("[Dossier mis à jour]\n" + cx); d.ctxHash = h; }
  }
  if(d.notes.length){ pre.push(d.notes.map(n => /^\[/.test(n) ? n : "[Appliqué] " + n).join("\n")); d.notes = []; }
  const kind = IAS.web ? "web" : IAS.fort ? "fort" : IAS.att.some(a => a.kind !== "text") ? "piece" : "base";
  const msg = {role:"user", text:opt.show || text, att:IAS.att.map(a => a.label), blocks:iaBlocks(pre, IAS.att, text), fort:IAS.fort, web:IAS.web, recap:!!opt.recap, kind, status:"wait"};
  d.view.push(msg); IAS.att = []; IAS.fort = false; IAS.web = false;

  ["#iaFort", "#iaWeb"].forEach(q => { const x = $(q); if(x) x.checked = false; });
  iaSaveConv(); iaDraw();
  await iaFlush();
}
async function iaFlush(){
  if(!IAS.data || IAS.busy) return;
  for(const m of IAS.data.view){ if(m.role === "user" && m.status === "wait"){ const ok = await iaPost(m); if(!ok) break; } }
}
async function iaPost(msg){
  const d = IAS.data, conv = IAS.conv;
  if(!navigator.onLine){ msg.status = "wait"; iaSaveConv(); iaDraw(); return false; }
  IAS.busy = true; msg.status = "send"; iaDraw();
  try{
    if(d.memo === null){ const inf = await syncCall({action:"iaInfo", memo:true}); if(inf && inf.ok === false && /inconnue/.test(inf.err||"")) throw new Error("script Google à mettre à jour pour la V3 (voir le guide)"); d.memo = inf && inf.memoire || ""; }
    d.api.push({role:"user", content:msg.blocks});
    const c = getClient(conv.clientId);
    const r = await syncCall({action:"ia", messages:d.api, memo:d.memo, fort:msg.fort, web:!!msg.web, driveHash:d.driveHash || "", log:msg.text + (msg.att.length ? " [pièces jointes : " + msg.att.join(", ") + "]" : ""), conv:{id:conv.id, titre:conv.titre, docId:conv.docId||"", client:c ? {id:c.id, nom:clientName(c)} : null}});
    if(!r || !r.ok){
      d.api.pop();
      /* Réflexions d’anciens messages liées à une autre version du script (consignes ou outils changés) : on les retire de l’historique et on renvoie une fois. */
      if(!msg.dropped && /signature|thinking/i.test(r && r.err || "")){
        msg.dropped = true; iaDropThinking(d); IAS.busy = false; iaSaveConv(); return await iaPost(msg);
      }
      throw new Error(r && r.err || "pas de réponse du script Google");
    }
    if(r.userContent) d.api[d.api.length - 1] = {role:"user", content:r.userContent};
    if(r.driveHash) d.driveHash = r.driveHash;
    (r.echange || []).forEach(x => d.api.push(x));
    d.api.push({role:"assistant", content:r.content});
    const cents = (r.usd || 0) * USD_EUR * 100;
    d.view.push({role:"ia", res:r.result, cents, model:r.model, applied:{}, lus:r.lus || [], recap:!!msg.recap, web:r.web || (msg.web ? {n:0, sources:[], err:"script Google pas encore mis à jour pour le web"} : null)});
    msg.status = "ok"; delete msg.err; delete msg.blocks;
    if(r.result.titre) conv.titre = r.result.titre;
    if(r.result.resume) conv.resume = r.result.resume;
    if(r.docId){ conv.docId = r.docId; conv.docUrl = r.docUrl; }
    conv.cents = (conv.cents || 0) + cents;
    IA.mois[ym()] = (IA.mois[ym()] || 0) + cents;
    (IA.stats[msg.kind] = IA.stats[msg.kind] || []).push(cents); if(IA.stats[msg.kind].length > 8) IA.stats[msg.kind].shift();
    IAS.busy = false; iaSaveConv(); iaDraw(); iaAlerte();
    return true;
  }catch(e){
    if(d.api.length && d.api[d.api.length-1].role === "user" && d.api[d.api.length-1].content === msg.blocks) d.api.pop();
    const net = /fetch|network|Failed|Load failed/i.test(e.message || "");
    msg.status = net ? "wait" : "err"; msg.err = net ? "pas de réseau" : e.message;
    IAS.busy = false; iaSaveConv(); iaDraw();
    return false;
  }
}

/* Compare deux morceaux de dictée : 1 = b déjà contenu dans a, 2 = b reprend a et va plus loin (on garde b), 0 = suite nouvelle. */
function iaSame(a, b){
  const w = x => x.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, "").split(/\s+/).filter(Boolean);
  const A = w(a), B = w(b); if(!B.length) return 1; if(!A.length) return 2;
  let k = 0; while(k < A.length && k < B.length && A[k] === B[k]) k++;
  const tailA = A.slice(-B.length).join(" ");
  if(k === B.length || tailA === B.join(" ")) return 1;
  if(k === A.length || k >= Math.max(3, Math.ceil(A.length * 0.6))) return B.length >= A.length ? 2 : 1;
  return 0;
}

    r.onresult = ev => {
      if(IAS.rec !== r) return;
      const fin = []; let interim = "";
      for(let k = 0; k < ev.results.length; k++){
        const t = ev.results[k][0].transcript.trim(); if(!t) continue;
        if(ev.results[k].isFinal){
          const p = fin[fin.length - 1], rel = p ? iaSame(p, t) : 0;
          if(rel === 1) continue; if(rel === 2) fin[fin.length - 1] = t; else fin.push(t);
        } else interim = t;
      }
      let s = fin.join(" ");
      if(interim){ const rel = s ? iaSame(s, interim) : 2; if(rel === 2) s = interim; else if(rel === 0) s = s + " " + interim; }
      sess = s; show(sess);
    };
    r.onerror = ev => { if(ev.error === "not-allowed" || ev.error === "service-not-allowed"){ IAS.recStop = true; toast("Micro refusé : autorisez-le dans le navigateur"); } else if(ev.error === "network"){ IAS.recStop = true; toast(navigator.onLine ? "Le service de dictée de ce navigateur ne répond pas. Sur PC : utilisez Chrome, ou la dictée Windows (touches Windows + H)" : "Dictée indisponible sans réseau"); } };
    r.onend = () => {
      if(IAS.rec !== r) return;
      if(sess){ const rel = done.length ? iaSame(done[done.length - 1], sess) : 0; if(rel === 2 && done.length > (first ? 1 : 0)) done[done.length - 1] = sess; else if(rel !== 1) done.push(sess); }
      sess = "";
      if(!IAS.recStop && !document.hidden){ start(); return; }
      IAS.rec = null; iaMicUi(false); show("");
    };
    IAS.rec = r;
    try{ r.start(); }catch(e){ IAS.rec = null; iaMicUi(false); }
  };
  IAS.recStop = false; iaMicUi(true); start();
}

/* Ajoute des fichiers à la question : photos et PDF lus directement par l’IA, texte inclus tel quel,

async function iaAddFiles(files){
  const c = iaClient(), dvx = iaDevisOf(c), cli = c ? {id:c.id, nom:clientName(c)} : null;
  let photos = 0;
  for(const f of files){
    const nm = f.name || "fichier", t = f.type || "";
    try{
      if(/^image\//.test(t)){
        const du = await readPhoto(f); IAS.att.push({kind:"image", label:nm, mt:"image/jpeg", data:du.split(",")[1]});
        if(dvx){ const id = uid(); await MEDIA.put("ph_" + id, du); chOf(dvx).photos.push({id, date:today(), phase:"Avant", note:"Envoyée au chat IA : " + nm}); photos++; }
      } else if(t === "application/pdf" || /\.pdf$/i.test(nm)){
        if(f.size > 20e6){ toast(nm + " : PDF trop lourd (20 Mo maximum)"); continue; }
        const du = await iaDataUrl(f); IAS.att.push({kind:"pdf", label:nm, data:du.split(",")[1]});
        if(syncOn()) syncCall({action:"putMedia", name:nm, data:du, desc:"Envoyé au chat IA le " + frDate(today()), client:cli, sub:"Documents"}).catch(() => {});
      } else if(/^text\//.test(t) || /\.(txt|csv|md|json)$/i.test(nm)){
        const tx = await f.text(); IAS.att.push({kind:"text", label:nm, data:"[Fichier « " + nm + " »]\n" + tx.slice(0, 60000)});
      } else {
        if(!syncOn()){ toast("Pour lire " + nm + ", réglez d’abord la synchronisation Google"); continue; }
        if(f.size > 25e6){ toast(nm + " : fichier trop lourd (25 Mo maximum)"); continue; }
        const w = {kind:"wait", label:nm}; IAS.att.push(w); iaDraw();
        const du = await iaDataUrl(f);
        syncCall({action:"lireFichier", nom:nm, data:du, client:cli}).then(r => {
          if(!r || !r.ok) throw new Error(r && /inconnue/.test(r.err || "") ? "script Google à mettre à jour" : (r && r.err) || "échec");
          Object.assign(w, r.kind === "text" ? {kind:"text", data:r.texte} : {kind:r.kind, mt:r.mt, data:r.data}); iaDraw();
        }).catch(e => { IAS.att = IAS.att.filter(x => x !== w); iaDraw(); toast(nm + " illisible : " + e.message); });
      }
    }catch(e){ toast(nm + " : fichier illisible"); }
  }
  if(photos){ touch(dvx); toast(photos > 1 ? photos + " photos aussi rangées dans le dossier du chantier" : "Photo aussi rangée dans le dossier du chantier"); }
  iaDraw();
}

const SCH_KEEP = ["structure","hp","auvent","ecl","ral","ralToit","finition","bardage","nbEP","poteau","membrure","treillisSec","pannesSec","lissesSec"];
/* Paramètres d’une action « schema » proposée par l’IA. */
function iaSchP(a, c){
  let o = null, dv = null, base = {};
  const ref = a.items.find(x => /^(sch\.)?ouvrage$/.test(String(x.cle).trim()));
  if(ref){ const id = String(ref.valeur || "").replace(/^\[?\s*ouvrage:/, "").replace(/\].*$/, "").trim(); const f = iaFind(c, "ouvrage", id) || iaFind(null, "ouvrage", id); if(f){ o = f.o; dv = f.dv; base = schFromOuv(o); } }
  const P = Object.assign({}, base), over = {}, ouv = {};
  a.items.forEach(it => {
    const k = String(it.cle || "").trim().replace(/^sch\./, ""), v = String(it.valeur == null ? "" : it.valeur).trim(); let q;
    if(k === "ouvrage") return;
    if((q = k.match(/^auvent\.(\w+)$/))){
      if(q[1] === "cote" && /aucun|non|sans/i.test(v)){ P.auvent = null; over.auvent = null; return; }
      const A = P.auvent = Object.assign({}, P.auvent || {cote:"arriere"}); A[q[1]] = q[1] === "poteaux" ? IA_OUI(v) : v; over.auvent = A; return; }
    if((q = k.match(/^ouv(\d+)\.(\w+)$/))){ (ouv[q[1]] = ouv[q[1]] || {})[q[2]] = v; return; }
    P[k] = v; if(SCH_KEEP.includes(k)) over[k] = v;
  });
  if(Object.keys(ouv).length) P.ouv = Object.keys(ouv).sort((x, y) => x - y).map(k => ouv[k]);
  if(!P.titre && o) P.titre = o.name;
  return {P, o, dv, over};
}

      const p = s => String(s).padStart(2, "0"), ds = date.replace(/-/g, "");
      let dates;
      if(h){ const st = new Date(date + "T" + p(h[1]) + ":" + p(h[2] || "0") + ":00"), en = new Date(st.getTime() + (num(val("duree")) || 60) * 60000); const f = x => x.getFullYear() + p(x.getMonth()+1) + p(x.getDate()) + "T" + p(x.getHours()) + p(x.getMinutes()) + "00"; dates = f(st) + "/" + f(en); }
      else dates = ds + "/" + icsDate(date, 1);
      const url = "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(val("titre") || a.titre) + "&dates=" + dates + "&ctz=Europe%2FParis&details=" + encodeURIComponent(val("details")) + "&location=" + encodeURIComponent(val("lieu"));
      window.open(url, "_blank");
      return "rendez-vous du " + frDate(date) + " ouvert dans Google Agenda";
    }
    case "message_client": {
      const canal = (val("canal") || "mail").toLowerCase(), corps = val("corps"), objet = val("objet");
      if(canal.startsWith("mail")){ if(!has(c.email)) throw new Error("Pas d’email sur la fiche client"); openMail(c.email, objet, corps); return "mail préparé pour " + c.email; }
      if(!has(c.tel)) throw new Error("Pas de téléphone sur la fiche client");
      if(canal.startsWith("whats")){ window.open("https://wa.me/" + phoneIntl(c.tel) + "?text=" + encodeURIComponent(corps), "_blank"); return "message WhatsApp préparé"; }
      goUrl("sms:" + c.tel.replace(/\s/g, "") + "?body=" + encodeURIComponent(corps)); return "SMS préparé";
    }
    case "prix_catalogue": {
      const all = CAT_GROUPS.flatMap(([g]) => catItems(g)), done = [], miss = [];
      items.forEach(x => {
        const n = pdfNorm(x.libelle);
        const it = all.find(y => pdfNorm(y.label) === n) || all.find(y => { const z = pdfNorm(y.label); return z && n && (z.includes(n) || n.includes(z)); });
        if(!it){ miss.push(x.libelle); return; }
        const cat = DB.catalog[it.key] = Object.assign({unit:it.unit}, DB.catalog[it.key] || {});
        const pv = iaNum(x.valeur); if(!pv){ miss.push(x.libelle); return; }
        if(x.cle === "pose") cat.mpu = pv; else cat.pu = pv;
        done.push(it.label);
      });
      saveNow(); if(miss.length) toast("Poste introuvable : " + miss.join(", "));
      return done.length ? "prix mis à jour : " + done.join(", ") : "aucun prix mis à jour";
    }
    case "materiel": {
      const rows = items.map(x => `<tr><td>${esc(x.libelle)}</td><td>${esc(x.valeur)}</td></tr>`).join("");
      return iaPdf(a.titre || "Liste de matériel", c, `<table><thead><tr><th>Désignation</th><th>Quantité – fournisseur</th></tr></thead><tbody>${rows}</tbody></table>`);
    }
    case "ordre_mission": {
      const dest = /sous/i.test(val("destinataire")) ? "sous-traitant" : "équipe de pose";
      const corps = items.filter(x => x.cle !== "destinataire").map(x => `<h2>${esc(x.libelle || x.cle)}</h2><p>${iaTxt(x.valeur)}</p>`).join("");
      return iaPdf("Ordre de mission – " + dest, c, corps);
    }
    case "pdf": {
      return iaPdf(a.titre || "Document", c, items.map(x => `<h2>${esc(x.libelle)}</h2><p>${iaTxt(x.valeur)}</p>`).join(""));
    }
    case "memoire": {
      return syncCall({action:"memoire", lignes:items.map(x => x.valeur || x.libelle)}).then(r => { if(!r || !r.ok) throw new Error(r && r.err || "mémoire injoignable"); return "retenu dans la mémoire ENDGO"; });
    }
    case "oublis": {
      const dv = iaDevisOf(c); if(!dv) throw new Error("Ce client n’a pas encore de devis");
      const o = dv.ouvrages.find(x => !x.variant) || dv.ouvrages[0]; if(!o) throw new Error("Le devis n’a pas d’ouvrage");
      items.forEach(x => iaAddLine(o, x.libelle, ""));
      logDv(dv, "Oublis ajoutés depuis le chat IA"); touch(dv);
      return items.length + " ligne" + (items.length > 1 ? "s" : "") + " ajoutée" + (items.length > 1 ? "s" : "") + " au devis " + dv.num + " (prix à compléter)";
    }
  }
  throw new Error("Action inconnue");
}
window.addEventListener("online", () => { if(IAS.data) iaFlush(); });

/* ================= Démarrage ================= */
function migrate(){
  DB.catalog = DB.catalog || {}; DB.models = DB.models || []; DB.settings = DB.settings || {};
  if(DB.lastExport===undefined) DB.lastExport = null;
  DB.devis.forEach(dv => { if(!dv.dates){ dv.dates = {}; if(dv.statut!=="Brouillon") dv.dates[dv.statut] = dv.updated || dv.date; } if(!dv.log) dv.log = []; });
  const NEW_COMMUN = TPL.commun.lines.filter(t => /Fournitures diverses|^Divers$/.test(t[0]));
  DB.devis.forEach(dv => dv.ouvrages.forEach(o => {
    Object.values(o.sec).forEach(arr => arr.forEach(ln => {
      if(!ln.nu) ln.nu = ln.unit;
      if(!ln.tpl && !ln.custom) ln.tpl = ln.label;
      if(ln.custom && ln.unitSet===undefined) ln.unitSet = true;
    }));
    ["couverture","bardage"].forEach(g => { if(o.sec[g]){ const t = TPL[g].lines.find(x => /^Vis \/ fixations/.test(x[0])); if(t && !o.sec[g].some(ln => ln.tpl===t[0])) o.sec[g].push(mkLine(t)); } });
    if(o.sec.commun){
      o.sec.commun = o.sec.commun.filter(ln => ln.tpl !== "Main-d’œuvre de pose");
      NEW_COMMUN.forEach(t => { if(!o.sec.commun.some(ln => ln.tpl===t[0])) o.sec.commun.push(mkLine(t)); });
    }
  }));
}
(function init(){
  applyTheme();
  document.body.classList.toggle("simple", simpleOn());
  const fill = (id, arr) => { document.getElementById(id).innerHTML = arr.map(v=>`<option value="${esc(v)}">`).join(""); };
  Object.entries(DATALISTS).forEach(([k,v]) => fill("dl-"+k, v));
  migrate();
  if(DB.ui.devisId && !curDevis()) DB.ui.devisId = null;
  if(!DB.ui.devisId && DB.devis.length) DB.ui.devisId = DB.devis[DB.devis.length-1].id;
  render();
  try{ if(!localStorage.getItem(TOUR_KEY)) setTimeout(tour, 700); }catch(e){}
  const s = document.getElementById("saveState");
  try{ localStorage.setItem("endgo_test","1"); localStorage.removeItem("endgo_test"); s.textContent = DB.clients.length||DB.devis.length ? "Données chargées" : "Sauvegarde sur cet appareil"; }
  catch(e){ s.textContent = "Sauvegarde locale indisponible : utilisez Exporter"; }
  window.addEventListener("pagehide", saveNow);
  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
  if(syncOn() && SYNC.auto!==false) setTimeout(() => syncNow(true), 1500);
  window.addEventListener("online", () => syncSchedule());
  document.addEventListener("visibilitychange", () => { if(document.hidden){ saveNow(); if(syncOn() && SYNC.auto !== false && dataHash() !== SYNC.hash){ clearTimeout(syncTimer); syncNow(true); } } else if(syncOn() && SYNC.auto !== false) syncNow(true); });
})();
