<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#03050D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>ENDGO Devis V3</title>
<style>
:root{
  --bgfill:#05091A;
  --bggrad:linear-gradient(165deg,#03050D 0%,#0A1A4F 55%,#1C4DB3 100%);
  --head:rgba(3,5,13,.72);
  --card:rgba(255,255,255,.07);
  --card2:rgba(255,255,255,.04);
  --solid:#0E1838;
  --line:rgba(255,255,255,.15);
  --ink:#F2F5FF;
  --soft:#A3B3D9;
  --accent:#FF8C21;
  --accent-ink:#1A0E02;
  --royal:#4C80F5;
  --input:rgba(0,0,0,.30);
  --danger:#FF7070;
  --ok:#3DD68C;
  --off:rgba(255,255,255,.35);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bgfill:#F2F4F9;
  --bggrad:linear-gradient(#F2F4F9,#F2F4F9);
  --head:linear-gradient(120deg,#060B22,#0D2C82 60%,#1F55C8);
  --card:#FFFFFF;
  --card2:#F7F8FC;
  --solid:#FFFFFF;
  --line:#DDE2EC;
  --ink:#121A33;
  --soft:#66708A;
  --accent:#E8730C;
  --accent-ink:#FFFFFF;
  --royal:#1F55C8;
  --input:#F5F7FB;
  --danger:#D64545;
  --ok:#17A673;
  --off:#9AA3B8;
  --shadow:0 10px 30px rgba(10,20,50,.15);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bgfill);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:110px}
body::before{content:"";position:fixed;inset:0;background:var(--bggrad);z-index:-1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--input);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
select{padding-right:6px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:40px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--head);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;padding:10px 16px 0;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid rgba(255,255,255,.12)}
.top-in{max-width:1000px;margin:0 auto}
.top-row{display:flex;align-items:center;gap:12px}
.top-row img{height:30px;display:block}
.top-row .v2{background:#FF8C21;color:#1A0E02;font-weight:800;font-size:.7rem;padding:2px 7px;border-radius:6px}
.top-row .sub{font-size:.72rem;color:#AFC0EA;letter-spacing:.06em;text-transform:uppercase;flex:1;min-width:0}
.savestate{font-size:.72rem;color:#AFC0EA;white-space:nowrap}
.iconbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:6px 10px;font-size:.95rem;line-height:1}
nav.tabs{display:flex;gap:4px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;white-space:nowrap;background:none;border:none;color:#C9D4F2;padding:10px 6px 11px;font-weight:700;font-size:.92rem;border-bottom:3px solid transparent}
nav.tabs button.on{color:#fff;border-bottom-color:#FF8C21}
.menu{position:absolute;right:16px;top:52px;background:var(--solid);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;min-width:240px;z-index:30}
.menu button{background:none;border:none;text-align:left;padding:10px 12px;border-radius:8px}
.menu button:hover{background:var(--card2)}

main{max-width:1000px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{margin:0 0 10px;font-size:1.02rem}
.card h3{margin:0;font-size:.95rem}
.muted{color:var(--soft)}
.small{font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid .wide{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:9px;padding:10px 14px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.blue{background:var(--royal);border-color:var(--royal);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:.85rem}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
.btn:active{transform:scale(.98)}
.dashed{display:block;width:100%;background:transparent;border:1.5px dashed var(--soft);color:var(--soft);border-radius:10px;padding:10px;font-weight:600}
.dashed.big{border-color:var(--accent);color:var(--accent);padding:14px;font-size:.95rem}
.empty{text-align:center;padding:30px 14px;color:var(--soft)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.t{border-collapse:collapse;width:100%;min-width:560px}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
table.t tr:last-child td{border-bottom:none}
table.t td.r,table.t th.r{text-align:right}
table.t tr.cur td{background:var(--card2)}
a.link{color:var(--royal)}
:root:not([data-theme="light"]) a.link{color:#8FB2FF}

/* devis */
.ouv{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ouv-head{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--card2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ouv-head .chev{background:none;border:none;font-size:1rem;color:var(--soft);padding:4px 6px}
.ouv-head .name{flex:1 1 160px;font-weight:700;font-size:1rem}
.ouv-head select{flex:1 1 220px;width:auto}
.ouv-head select.variant{flex:0 1 150px}
.ouv-head .sub{font-weight:800;color:var(--accent);white-space:nowrap}
.ouv-body{padding:12px;display:flex;flex-direction:column;gap:14px}
.ouv.closed .ouv-body{display:none}
.qinfo{font-size:.8rem;color:var(--soft);background:var(--card2);border:1px dashed var(--line);border-radius:8px;padding:7px 10px}
.opts{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.subrow{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1.2fr auto;gap:8px;align-items:end}
.subrow.hv{grid-template-columns:1fr 1fr 1fr 1fr auto}
.subrow .x{background:none;border:none;color:var(--soft);padding:10px 6px}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.sec{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--card2);font-weight:700;gap:8px}
.sec-h .tot{color:var(--soft);font-weight:600;white-space:nowrap}
.line{display:grid;grid-template-columns:30px minmax(0,1.5fr) minmax(0,3fr);gap:8px;align-items:center;padding:8px 10px;border-top:1px dashed var(--line)}
.line:first-of-type{border-top:none}
.line .x{background:none;border:none;color:var(--soft);font-size:1rem;padding:4px;align-self:center}
.line .lab{display:flex;flex-direction:column;gap:4px;min-width:0}
.line .lab .ll{font-weight:600;border-color:transparent;background:transparent;padding:4px 6px}
.line .lab .ll:focus{border-color:var(--accent);background:var(--input)}
.line .lab .dyn{font-weight:600;padding:4px 6px}
.line .lab .rf{font-size:.85rem;padding:6px 8px}
.kginfo{font-size:.75rem;color:var(--accent);padding:0 4px}
.basew{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--soft)}
.basew span{white-space:nowrap}
.basew select{padding:4px 6px;font-size:.8rem;width:auto;flex:1}
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) 180px;gap:6px;align-items:end}
.nums label{display:flex;flex-direction:column;gap:2px;min-width:0}
.nums label>span{font-size:.66rem;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums label>span.qwrap{overflow:visible}
.nums input,.nums select{padding:7px 6px;text-align:right}
.nums select{text-align:left}
.qwrap{display:flex;gap:4px;align-items:stretch;min-width:0}
.qwrap input{flex:1;min-width:0}
.qwrap input.auto{color:var(--soft);font-style:italic}
.qwrap .reset{flex:none;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:6px;font-size:.7rem;font-weight:700;padding:0 5px}
select option{background:var(--solid);color:var(--ink)}
.sums{grid-column:6;grid-row:1 / span 2;display:flex;flex-direction:column;justify-content:center;gap:3px;border-left:1px dashed var(--line);padding-left:10px}
.sums div{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--soft)}
.sums b{color:var(--ink);white-space:nowrap}
.sums .t{font-size:.92rem;font-weight:800}
.sums .t span,.sums .t b{color:var(--accent)}
.subw{display:flex;flex-direction:column;align-items:flex-end}
.subd{font-size:.72rem;color:var(--soft);white-space:nowrap}
.cathead,.catrow{display:grid;grid-template-columns:minmax(0,2fr) 100px 130px 100px 130px 30px;gap:8px;align-items:center}
.cathead{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);padding:0 0 6px;border-bottom:1px solid var(--line)}
.catrow{padding:7px 0;border-bottom:1px dashed var(--line)}
.catrow .cl{font-weight:600}
.catrow label>span{display:none}
.catrow input,.catrow select{padding:7px 6px}
.catrow input{text-align:right}
.catrow .x{background:none;border:none;color:var(--soft)}
.sugg{border:none;background:none;color:var(--accent);font-size:.68rem;padding:2px 0 0;text-align:right;white-space:nowrap}
.ltot{text-align:right;font-weight:800;padding-bottom:7px;white-space:nowrap}
.line.off .lab,.line.off .nums{opacity:.4}
.line.off .ll,.line.off .dyn{text-decoration:line-through}
.line.off .x{color:var(--accent)}
.ech{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px;display:flex;flex-direction:column;gap:6px}
.echrow{display:grid;grid-template-columns:minmax(0,1fr) 70px 16px 30px;gap:6px;align-items:center;margin-bottom:6px}
.echrow .x{background:none;border:none;color:var(--soft)}
.banner{background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{flex:1 1 200px}
.warn{color:var(--accent);font-size:.72rem;font-weight:700}
.tools.calc{margin-top:10px;align-items:center}
.res{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem}
.res table{width:100%;border-collapse:collapse}.res td{padding:4px 2px;border-bottom:1px dashed var(--line);vertical-align:top}.res td.r{text-align:right;white-space:nowrap}
.disc{border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:8px 10px;font-size:.82rem;font-weight:600}
.schema svg{width:100%;height:auto;background:#fff;border-radius:10px;display:block}
.schbox{display:flex;flex-direction:column;gap:10px}.schtabs{gap:6px}.schreg summary{cursor:pointer;font-weight:700;padding:4px 0}.schreg .grid{margin-top:8px}
.poidsw{overflow-x:auto}.poidsw table{width:100%;border-collapse:collapse;font-size:.88rem}.poidsw th,.poidsw td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.poidsw .r{text-align:right;white-space:nowrap}.poidsw tr.ph td{background:var(--card2)}.poidsw tfoot td{font-weight:700}.poidsw small{color:var(--soft)}
.iaschs{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}.iaschs .schema{cursor:zoom-in}.iaschs svg{border-radius:8px}
.pcs{display:grid;grid-template-columns:1fr 90px 70px 28px;gap:6px;align-items:center;margin-bottom:4px}
.pcs .x{background:none;border:none;color:var(--soft)}
.micbtn{position:fixed;right:14px;bottom:128px;width:52px;height:52px;border-radius:50%;border:none;background:var(--royal);color:#fff;font-size:1.4rem;box-shadow:var(--shadow);z-index:60}
.micbtn.on{background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.day{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--card2);text-align:left;color:var(--ink);cursor:pointer}
.day.plan{border-color:var(--accent);border-width:2px}
.day b{display:block;font-size:.85rem}.day span{display:block;font-size:.78rem;color:var(--soft)}
.chip{display:inline-block;border-radius:20px;padding:1px 8px;font-size:.72rem;font-weight:700;margin-top:4px}
.chip.g{background:rgba(61,214,140,.18);color:var(--ok)}.chip.o{background:rgba(255,140,33,.18);color:var(--accent)}.chip.r{background:rgba(255,112,112,.18);color:var(--danger)}
.syncst{font-size:.85rem}
.signinfo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.signinfo img{height:54px;background:#fff;border-radius:8px;padding:2px 8px}
canvas.pad{width:100%;height:auto;display:block;background:#fff;border-radius:10px;touch-action:none;border:1px solid var(--line)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools .btn.on{background:var(--royal);border-color:var(--royal);color:#fff}
.modal.wide{max-width:980px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card2);border:1px solid var(--line);padding:0;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.sk img{object-fit:contain;background:#fff}
.thumb span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:.7rem;padding:3px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi small{display:block;color:var(--soft);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.kpi b{font-size:1.25rem;display:block;margin-top:2px}
.kpi span{font-size:.78rem;color:var(--soft)}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px;margin-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:.7rem;color:var(--soft)}
.bars i{display:block;width:100%;max-width:46px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.item{border-bottom:1px dashed var(--line);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.item:last-child{border-bottom:none}
.item .row{gap:6px}
.prog{height:10px;border-radius:6px;background:var(--card2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.prog.over i{background:var(--danger)}
.hist{display:flex;flex-direction:column;gap:2px;font-size:.85rem}
.hist div{display:grid;grid-template-columns:86px 1fr;gap:8px}
.fline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px;font-weight:400}
.fb{background:none;border:1px solid var(--line);color:var(--soft);border-radius:8px;padding:2px 8px;font-size:.72rem;cursor:pointer}
.tube{border:1px solid var(--line);border-radius:12px;padding:10px}
.pdfrev{display:flex;flex-direction:column;gap:10px}
.pdfrev .sub{margin:6px 0 0}
.pdfl{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.pdfl.off{opacity:.5}
.pdfl textarea{min-height:38px;resize:vertical;flex:1 1 auto;min-width:0;width:auto}
.pdfl input[type=checkbox],.chk input[type=checkbox]{width:22px;height:22px;flex:0 0 auto;margin:8px 0 0}
.chk input[type=checkbox]{margin:0}
.pdfl .x{background:none;border:none;color:var(--soft);cursor:pointer;font-size:1rem;padding:6px}
.pdfg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.pdfg{grid-template-columns:1fr 1fr}}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem}
.frow{display:grid;grid-template-columns:1fr auto auto 28px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.frow.add{grid-template-columns:1.4fr 1fr 1.2fr auto;border:none}
@media (max-width:560px){.frow.add{grid-template-columns:1fr 1fr}}
.frow .x{background:none;border:none;color:var(--soft);cursor:pointer}
.ok{color:var(--ok);font-weight:700}
h3.sub{font-size:.85rem;margin:14px 0 4px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--accent)}details[open]>summary::before{content:"▾ "}
.addline{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;padding:10px;border-top:1px dashed var(--line)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--solid);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.25);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .tot{flex:1;min-width:0}
.bar .tot b{display:block;font-size:1.15rem;color:var(--accent)}
.bar .tot small{color:var(--soft);font-size:.72rem}

/* checklist */
.cl-sec{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cl-h{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--card2);border-bottom:1px solid var(--line)}
.cl-h input{font-weight:700;background:transparent;border-color:transparent}
.cl-h input:focus{background:var(--input);border-color:var(--accent)}
.pbar{width:60px;height:6px;border-radius:99px;background:var(--line);overflow:hidden;flex:none}
.pbar i{display:block;height:100%;background:var(--ok);width:0}
.pct{font-size:.75rem;color:var(--soft);min-width:34px;text-align:right}
.cl-item{display:flex;flex-direction:column;gap:6px;padding:8px 12px;border-top:1px dashed var(--line)}
.cl-item:first-child{border-top:none}
.cl-row{display:flex;gap:8px;align-items:center}
.cl-row input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--ok)}
.cl-row input[type=text]{background:transparent;border-color:transparent;padding:5px 6px}
.cl-row input[type=text]:focus{background:var(--input);border-color:var(--accent)}
.cl-item.done input[type=text]{text-decoration:line-through;color:var(--soft)}
.cl-row .ic{background:none;border:none;color:var(--soft);padding:4px 6px;flex:none}
.cl-row .ic.has{color:var(--accent)}
.cl-add{display:flex;gap:8px;padding:10px 12px;border-top:1px dashed var(--line)}
.cl-note{padding:0 12px 10px}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(2,4,12,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:700px){.modal-bg{align-items:center}}
.modal{background:var(--solid);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font-size:1.05rem}
.modal .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#0B1E5B;color:#fff;padding:9px 18px;border-radius:99px;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90%;text-align:center;border:1px solid rgba(255,255,255,.2)}
.toast.show{opacity:1}

@media (max-width:760px){
  .line{grid-template-columns:30px minmax(0,1fr)}
  .line .nums{grid-column:2/3;grid-template-columns:1fr 1fr 1fr}
  .sums{grid-column:1/-1;grid-row:auto;border-left:none;padding-left:0;border-top:1px dashed var(--line);padding-top:6px}
  .cathead{display:none}
  .catrow{grid-template-columns:1fr 1fr 30px;padding:10px 0}
  .catrow .cl{grid-column:1/-1}
  .catrow label>span{display:block;font-size:.66rem;color:var(--soft);font-weight:700;text-transform:uppercase}
  .catrow label{display:flex;flex-direction:column;gap:2px}
  .catrow>span:last-child,.catrow>.x{grid-column:3;grid-row:2}
  nav.tabs .lg{display:none}
  .subrow{grid-template-columns:1fr 1fr 1fr}
  .subrow>:first-child{grid-column:1/-1}
  .subrow.hv>:first-child{grid-column:auto}
  .subrow.hv{grid-template-columns:1fr 1fr 1fr auto}
  .addline{grid-template-columns:1fr 90px}
  .addline .btn{grid-column:1/-1}
  nav.tabs button{font-size:.85rem}
  .top-row .sub{display:none}
}

  if(m){ const k = m[1]+" "+m[2]; if(PROFILS[k]) return PROFILS[k]; }
  const hit = Object.keys(PROFILS).find(k => r.includes(k)); return hit ? PROFILS[hit] : null;
}

function download(name, content, type, dataUrl){

  const a = document.createElement("a"); a.href = url; a.download = name;

}

function newOuvrage(type, n){
  const o = {id:uid(), name:"Ouvrage "+(n||1), type, open:true,
    d:{L:"",l:"",H:"",toit:(TYPES[type].toit||"2p"),pente:"10",Hav:"",Har:"",deb:"0",nbEP:"",entPort:"6",entPannes:"1,5",entLisses:"1,5",potelets:"0",gcL:"",gcH:"1",clotL:"",nbPortails:"1",nbPortillons:"0",portL:"",portH:""},
    hauvents:[], ouv:[], fumi:{on:false,q:"1"}, sec:{}, dyn:{}};
  buildSections(o); return o;
}
function mkLine(t){ return {id:uid(), label:t[0], tpl:t[0], nu:t[1], unit:t[1], f:t[2]||null, list:t[3]||null, off:!!t[4], ref:"", qty:"", pu:t[5]==="mo"?"0":"", chute:"", marge:""}; }
function buildSections(o){
  const keepCommun = o.sec.commun;
  o.sec = {};
  TYPES[o.type].sections.forEach(k => { o.sec[k] = (k==="commun" && keepCommun) ? keepCommun : TPL[k].lines.map(mkLine); });
  if(o.type==="metal" && o.sec.commun) o.sec.commun.forEach(ln => { if(!/Fournitures diverses/.test(ln.tpl||"") && !has(ln.pu) && !has(ln.qty)) ln.off = true; });
}
function dynData(o, key, def){
  if(!o.dyn[key]) o.dyn[key] = Object.assign({ref:"",qty:"",pu:"",chute:"",marge:"",off:false,unit:def.unit}, {});
  return o.dyn[key];
}

/* ---------- Calcul des quantités ---------- */
function quantities(o){
  const d = o.d, L = num(d.L), l = num(d.l), deb = num(d.deb);
  let H = num(d.H), toit = d.toit || "2p", p = 0, Hlow = H, Hhigh = H;
  if(toit==="1ph"){ const a = num(d.Hav), b = num(d.Har); Hlow = Math.min(a,b); Hhigh = Math.max(a,b); H = Hlow; p = l ? (Hhigh-Hlow)/l : 0; }
  else if(toit!=="plat"){ p = num(d.pente)/100; }
  const k = Math.sqrt(1+p*p);
  let hf = 0;
  if(toit==="2p"){ hf = l/2*p; Hhigh = H + hf; }
  if(toit==="1p"){ Hhigh = H + l*p; }
  const mono = (toit==="1p"||toit==="1ph");
  const ramp = l*k;
  const q = {one:1, L, l};
  q.pente = p*100; q.Hlow = Hlow; q.Hhigh = Hhigh;
  q.emprise = L*l; q.perimetre = 2*(L+l);
  q.couv = (L+2*deb)*(ramp+2*deb);
  const longpans = mono ? L*(Hlow+Hhigh) : 2*L*H;
  const pignons = toit==="2p" ? 2*(l*H + l*hf/2) : (mono ? l*(Hlow+Hhigh) : 2*l*H);
  q.bardBrut = longpans + pignons;
  let sOuv = 0, wDoors = 0, hab = 0;

function sectionsOf(o){
  const out = [];

      o.hauvents.forEach((h,i) => {

          ["couv","Couverture hauvent","m²",()=>hvQ(h).couv,"bac"],
          ["rives","Rives hauvent","ml",()=>hvQ(h).rives],
          ["gout","Gouttière hauvent","ml",()=>hvQ(h).gout],
          ["solin","Solin / raccord au bâtiment","ml",()=>hvQ(h).solin]
        ].map(([id,label,unit,fn,list]) => ({key:sk+"_"+id, ckey:"hauvent|"+label, label, unit, auto:fn, list, data:dynData(o, sk+"_"+id, {unit}), dyn:true}));
        const hl = dl.concat(o.sec[sk].map(ln => staticLine(ln)));
        hl.forEach(x => { x.o = o; x.sbase = "hauvent"; if(!x.ckey) x.ckey = "hauvent|" + (x.data.tpl || x.data.label); });
        out.push({key:sk, base:"hauvent", title:"Hauvent "+(i+1), lines: hl});
      });
    }
    if(!o.sec[k]) o.sec[k] = (TPL[k]?TPL[k].lines.map(mkLine):[]);
    let lines = o.sec[k].map(ln => staticLine(ln));
    if(k==="couverture" && o.fumi.on){
      lines.push({key:"fumi", ckey:"couverture|Fumidôme / exutoire", label:"Fumidôme / exutoire", unit:"u", auto:()=>num(o.fumi.q), data:dynData(o,"fumi",{unit:"u"}), dyn:true});
    }
    if(k==="tubes"){
      o.tubes = o.tubes || [];
      lines = o.tubes.map(x => ({key:"tube_"+x.id, ckey:"tubes|"+(has(x.sec)?x.sec.trim():"Tube"), label:()=>has(x.sec)?x.sec.trim():"Tube (section à indiquer)", unit:"ml", auto:()=>tubeCalc(x).ml, list:"tubes", data:dynData(o,"tube_"+x.id,{unit:"ml"}), dyn:true})).concat(lines);
    }
    if(k==="ouvertures"){
      const dl = o.ouv.map(x => ({key:"ouv_"+x.id, ckey:"ouvertures|"+OUV_TYPES[x.type], label:()=>OUV_TYPES[x.type]+" "+fmtQ(num(x.w))+" × "+fmtQ(num(x.h))+" m", unit:"u", auto:()=>num(x.q), data:dynData(o,"ouv_"+x.id,{unit:"u"}), dyn:true}));
      if(o.ouv.length) dl.push({key:"habOuv", ckey:"ouvertures|Habillages autour des ouvertures", label:"Habillages autour des ouvertures", unit:"ml", auto:Q=>Q.habOuv, data:dynData(o,"habOuv",{unit:"ml"}), dyn:true});
      lines = dl.concat(lines);
    }
    lines.forEach(x => { x.o = o; x.sbase = k; if(!x.ckey) x.ckey = k + "|" + (x.data.tpl || x.data.label); });
    out.push({key:k, base:k, title:TPL[k].title, lines});

}
function staticLine(ln){ return {key:ln.id, label:ln.label, unit:ln.nu || ln.unit, auto: ln.f ? (Q => Q[ln.f]||0) : null, list:ln.list, data:ln, dyn:false, stored:ln}; }

function margeDef(){ return num(S("margeDef")); }
const AUTO_UNITS = ["m²","ml","u"];
/* Sources de quantité proposées selon l'unité (prises dans les dimensions de l'ouvrage) */
function baseOptions(o, unit){
  const g = TYPES[o.type].geo, secs = TYPES[o.type].sections;
  if(unit==="u") return [["one","1 (unité)"]].concat(o.ouv.length?[["nbOuv","Nombre d’ouvertures"]]:[]);
  if(unit==="m²"){
    if(g==="bat"){ const r=[["emprise","Surface au sol"]]; if(secs.includes("couverture")||o.type==="ossature"||o.type==="oss_bard") r.push(["couv","Couverture"]); r.push(["bardNet","Bardage net"],["bardBrut","Bardage brut"]); return r; }
    if(g==="boite") return [["froidMurs","Murs"],["froidPlafond","Plafond / sol"],["emprise","Surface au sol"]];
    if(g==="plan") return [["emprise","Surface"]];
    return [];
  }
  if(unit==="ml"){
    if(g==="bat") return [["perimetre","Périmètre"],["L","Longueur"],["larmiers","Larmiers"],["angles","Angles"],["gouttieres","Gouttières"],["faitage","Faîtage"],["rives","Rives"],["potML","Poteaux (métré)"],["travML","Traverses (métré)"],["panML","Pannes (métré)"],["lisML","Lisses (métré)"]];
    if(g==="boite"||g==="plan") return [["perimetre","Périmètre"],["L","Longueur"]];
    if(g==="lin") return [["gcL","Longueur"]];
    if(g==="cloture") return [["clotL","Longueur de clôture"]];

function defaultBase(o, sbase, unit){
  if(unit==="u") return "one";
  if(unit==="m²") return ({couverture:"couv",bardage:"bardNet",froid:"froidMurs"})[sbase] || "emprise";
  if(unit==="ml") return ({couverture:"gouttieres",bardage:"larmiers"})[sbase] || "perimetre";
  return null;
}
function autoQty(L, Q, unit, base){
  if(L.auto && unit===L.unit) return {v:L.auto(Q), src:null};
  if(unit==="kg"){ // poids = métré × kg/m du profilé indiqué en référence
    const pr = profil(L.data.ref), mk = MLKEY[L.data.tpl];
    if(pr && mk && Q[mk]) return {v:Q[mk]*pr.kgm, src:null, kg:{p:pr, ml:Q[mk]}};
    return null;
  }
  if(!L.o || !AUTO_UNITS.includes(unit)) return null;
  const op = baseOptions(L.o, unit); if(!op.length) return null;
  let b = base; if(!op.some(x=>x[0]===b)) b = defaultBase(L.o, L.sbase, unit);
  if(!op.some(x=>x[0]===b)) b = op[0][0];
  const v = b==="one" ? 1 : b==="nbOuv" ? L.o.ouv.reduce((a,x)=>a+num(x.q),0) : (Q[b]||0);
  return {v, src:b, options:op};
}
function catOf(L){ return DB.catalog[L.ckey] || {}; }
/* Calcul d'une ligne : fourniture + main-d'œuvre, valeurs du catalogue (onglet Prix) quand la case du devis est vide.
   Chutes et marge ne s'appliquent qu'aux matériaux. */
function lineCalc(L, Q){
  const d = L.data, cat = catOf(L);
  const unit = d.unitSet ? d.unit : (cat.unit || L.unit);
  const munit = d.munitSet ? d.munit : (cat.munit || unit);
  const aq = autoQty(L, Q, unit, d.base);
  const auto = aq ? aq.v : null;
  const manual = has(d.qty);
  const qty = manual ? num(d.qty) : (auto||0);
  const pr = unit==="kg" ? profil(d.ref) : null, pk = pr ? (S("prixKg")||{})[pr.fam] : null;
  const puAuto = has(pk) ? num(pk) : (has(cat.pu) ? num(cat.pu) : null);
  const pu = has(d.pu) ? num(d.pu) : (puAuto||0);
  const mq = munit===unit ? {v:qty, src:null} : autoQty(L, Q, munit, d.mbase);
  const mqAuto = mq ? mq.v : null;
  const mqty = has(d.mqty) ? num(d.mqty) : (mqAuto||0);
  const mpuAuto = has(cat.mpu) ? num(cat.mpu) : null;
  const mpu = has(d.mpu) ? num(d.mpu) : (mpuAuto||0);
  const chute = num(d.chute), marge = has(d.marge) ? num(d.marge) : margeDef(), k = 1 + marge/100;
  const qtyCh = qty*(1+chute/100);
  const mat = d.off ? 0 : qtyCh*pu*k;
  const mo = d.off ? 0 : mqty*mpu;
  const total = mat + mo;
  // coût de revient : matériaux sans marge ; main-d'œuvre au taux chargé si elle est à l'heure
  const tc = num(S("tauxCharge"));
  const cost = d.off ? 0 : qtyCh*pu + ((munit==="h" && tc) ? mqty*tc : mqty*mpu);
  return {cost, auto, aq, manual, qty, qtyCh, pu, puAuto, mq, mqAuto, mqty, mpu, mpuAuto, mat, mo, total,
    puClient: qty ? total/qty : 0, unit, munit, missing: !has(d.pu) && puAuto===null};
}
function ouvrageTotals(o){
  const Q = quantities(o); let tot = 0, mat = 0, mo = 0, cost = 0, missing = 0, active = 0;
  sectionsOf(o).forEach(s => s.lines.forEach(L => { const c = lineCalc(L,Q); if(!L.data.off){ active++; tot += c.total; mat += c.mat; mo += c.mo; cost += c.cost; if(c.missing) missing++; } }));
  return {tot, mat, mo, cost, missing, active, Q};
}
const VARIANTES = [["","Devis de base"],["A","Option A"],["B","Option B"],["C","Option C"]];
function devisTotals(dv){
  let ht = 0, mat = 0, mo = 0, cost = 0, missing = 0; const options = {};
  dv.ouvrages.forEach(o => { const t = ouvrageTotals(o); missing += t.missing;
    if(o.variant){ const x = options[o.variant] = options[o.variant] || {ht:0,mat:0,mo:0,cost:0,names:[]}; x.ht += t.tot; x.mat += t.mat; x.mo += t.mo; x.cost += t.cost; x.names.push(o.name); }

  send.addEventListener("click", e => { const a=e.target.dataset.a; if(a==="sign") signDevis(dv); if(a==="unsign") confirmBox("Annuler la signature de ce devis ?", "Annuler la signature", () => { dv.signature = null; logDv(dv, "Signature annulée"); touch(dv); render(); }); if(a==="four") mailFournisseur(dv); if(a==="cli") mailClient(dv); if(a==="dl") downloadDevis(dv); if(a==="wa"||a==="sms") sendPhone(dv, a); });
  main.appendChild(send);

  const bar = $("#bar"); bar.hidden = false;
  bar.innerHTML = `<div class="bar-in"><div class="tot"><small id="matLine"></small><b class="num" id="grandHT">0,00 €</b><small>Total HT · <span id="ttcLine"></span></small></div>
    <button class="btn" type="button" id="saveBtn">Enregistrer</button><button class="btn primary" type="button" id="calcBtn">Calculer</button></div>`;
  $("#saveBtn").addEventListener("click", () => { saveNow(); toast("Devis enregistré sur l’appareil"); });
  $("#calcBtn").addEventListener("click", () => { saveNow(); showRecap(dv); });
  recalc();
}
function touch(dv){ dv.updated = today(); save(); }
function cloneOuvrage(o){
  const c = JSON.parse(JSON.stringify(o)); c.id = uid();
  const remap = {};
  c.hauvents.forEach(h => { const n=uid(); remap["hv_"+h.id]="hv_"+n; h.id=n; });
  c.ouv.forEach(x => { const n=uid(); remap["ouv_"+x.id]="ouv_"+n; x.id=n; });
  (c.tubes||[]).forEach(x => { const n=uid(); remap["tube_"+x.id]="tube_"+n; x.id=n; });
  const dyn = {}; Object.entries(c.dyn).forEach(([k,v]) => { let nk=k; Object.entries(remap).forEach(([a,b])=>{ if(nk.startsWith(a)) nk=b+nk.slice(a.length); }); dyn[nk]=v; }); c.dyn = dyn;
  const sec = {}; Object.entries(c.sec).forEach(([k,v]) => { sec[remap[k]||k] = v.map(ln => Object.assign(ln,{id:uid()})); }); c.sec = sec;
  return c;
}

function chantierAdresse(c){ if(!c) return ""; return has(c.chantier) ? c.chantier : [c.adresse, c.cp, c.ville].filter(has).join(" "); }
function navLinks(adr){

}

  // dimensions

    if(d.toit!=="plat") dims += numField("Débord de toit (m)", d.deb, "deb", 'placeholder="0"');

    if(T.sections.includes("ossature")) dims += numField("Entraxe portiques (m)", has(d.entPort)?d.entPort:"6", "entPort") + numField("Entraxe pannes (m)", has(d.entPannes)?d.entPannes:"1,5", "entPannes") + numField("Entraxe lisses (m)", has(d.entLisses)?d.entLisses:"1,5", "entLisses") + numField("Potelets par pignon", d.potelets||"0", "potelets");
  } else if(g==="boite"){ dims += numField("Longueur (m)", d.L, "L") + numField("Largeur (m)", d.l, "l") + numField("Hauteur (m)", d.H, "H"); }

  body.appendChild(dimBox);
  const descBox = el(`<div class="f" style="margin-top:10px"><span>Descriptif pour le client (imprimé sur le devis)</span><textarea rows="3" data-desc placeholder="Ex. Portail 2 vantaux en acier thermolaqué RAL 7016, cadre tube 60×40, remplissage tôle pleine, ouverture vers l’intérieur…">${esc(o.desc||"")}</textarea>${syncOn() ? `<div class="row" style="margin-top:6px"><button type="button" class="btn sm" data-descia>✨ Rédiger avec l’IA</button></div>` : ""}</div>`);
  $("[data-desc]", descBox).addEventListener("input", e => { o.desc = e.target.value; touch(dv); });
  const dIa = $("[data-descia]", descBox); if(dIa) dIa.addEventListener("click", () => iaDescriptif(dv, o));
  body.appendChild(descBox);
  if(g==="tubes" || T.sections.includes("tubes")) body.appendChild(tubesPanel(dv, o, () => recalc()));
  if(g==="cloture" || g==="lin"){
    const tb = el(`<div class="tools calc"><span class="muted small">Outils :</span><button class="btn sm" type="button">Schéma coté</button><span class="muted small">imprimé sur le devis dès que les dimensions sont remplies</span></div>`);
    $("button", tb).addEventListener("click", () => toolSchema(dv, o)); body.appendChild(tb);
  }
  if(g==="bat"){
    const tb = el(`<div class="tools calc"><span class="muted small">Outils :</span><button class="btn sm" type="button" data-tool="schema">📐 Schémas</button><button class="btn sm" type="button" data-tool="nv">Neige et vent</button><button class="btn sm" type="button" data-tool="predim">Pré-dimensionnement</button><button class="btn sm" type="button" data-tool="debit">Débits</button><button class="btn sm" type="button" data-tool="levage">Levage</button><button class="btn sm" type="button" data-tool="poids">Poids et débits</button></div>`);
    tb.addEventListener("click", e => { const t = e.target.dataset.tool; if(t) CALC_TOOLS[t](dv, o); });
    body.appendChild(tb);
  }

  // options : hauvent, ouvertures, fumidôme
  const hasOuv = T.sections.includes("ouvertures"), hasFumi = T.sections.includes("couverture");
  if(T.hauvent || hasOuv || hasFumi){
    const box = el(`<div class="opts"></div>`);
    if(hasOuv){
      const ob = el(`<div><div class="check" style="margin-bottom:6px">Ouvertures (portes, fenêtres)</div><div data-list style="display:flex;flex-direction:column;gap:8px"></div><button class="dashed" type="button" style="margin-top:8px">+ Ajouter une ouverture</button></div>`);
      o.ouv.forEach(x => {
        const r = el(`<div class="subrow"><label class="f"><span>Type</span><select data-k="type">${opts(Object.entries(OUV_TYPES), x.type)}</select></label>

        $("[data-k=type]", r).addEventListener("change", e => { x.type = e.target.value; touch(dv); recalc(); });
        $("[data-k=cote]", r).addEventListener("change", e => { x.cote = e.target.value; touch(dv); });
        $(".x", r).addEventListener("click", () => { o.ouv = o.ouv.filter(y=>y!==x); delete o.dyn["ouv_"+x.id]; touch(dv); render(); });
        $("[data-list]", ob).appendChild(r);

        $$("[data-d]", r).forEach(inp => inp.addEventListener("input", e => { h[inp.dataset.d] = e.target.value; touch(dv); recalc(); }));
        $("[data-k=cote]", r).addEventListener("change", e => { h.cote = e.target.value; touch(dv); });
        $(".x", r).addEventListener("click", () => { o.hauvents = o.hauvents.filter(y=>y!==h); Object.keys(o.dyn).forEach(k=>{ if(k.startsWith("hv_"+h.id)) delete o.dyn[k]; }); delete o.sec["hv_"+h.id]; touch(dv); render(); });

      $("input[type=checkbox]", fb).addEventListener("change", e => { o.fumi.on = e.target.checked; touch(dv); render(); });

      box.appendChild(fb);

    body.appendChild(box);

  // sections de postes
  sectionsOf(o).forEach(s => body.appendChild(renderSection(dv, o, s)));
  REG.push({type:"ouv", o, card});
  return card;
}

function renderSection(dv, o, s){
  const box = el(`<div class="sec"><div class="sec-h"><span>${esc(s.title)}</span><span class="tot num" data-stot></span></div><div class="lines"></div></div>`);
  const lines = $(".lines", box);
  s.lines.forEach(L => lines.appendChild(renderLine(dv, o, s, L)));
  // ajouter un poste
  const lib = DB.lib.custom[s.base] || [];
  const dlId = "dlc-"+s.base;
  if(!document.getElementById(dlId)){ document.body.appendChild(el(`<datalist id="${dlId}"></datalist>`)); }
  document.getElementById(dlId).innerHTML = lib.map(x=>`<option value="${esc(x.label)}">`).join("");
  const add = el(`<div class="addline"><input placeholder="+ Nouveau poste (désignation)" list="${dlId}"><select aria-label="Unité">${opts(UNITS, s.base==="ouvertures"?"u":"m²")}</select><button class="btn sm" type="button">Ajouter</button></div>`);
  const [inp, sel, btn] = [$("input",add), $("select",add), $("button",add)];
  inp.addEventListener("input", () => { const m = lib.find(x=>x.label.toLowerCase()===inp.value.trim().toLowerCase()); if(m) sel.value = m.unit; });
  const doAdd = () => {
    const label = inp.value.trim(); if(!label){ inp.focus(); return; }
    o.sec[s.key] = o.sec[s.key] || [];
    o.sec[s.key].push({id:uid(), label, unit:sel.value, nu:sel.value, unitSet:true, f:null, list:null, off:false, ref:"", qty:"", pu:"", chute:"", marge:"", custom:true});
    DB.lib.custom[s.base] = (DB.lib.custom[s.base]||[]).filter(x=>x.label.toLowerCase()!==label.toLowerCase()).concat([{label, unit:sel.value}]);
    touch(dv); render();
    toast("Poste ajouté et mémorisé pour les prochains devis");
  };
  btn.addEventListener("click", doAdd);
  inp.addEventListener("keydown", e => { if(e.key==="Enter") doAdd(); });
  box.appendChild(add);
  REG.push({type:"sec", o, s, box});
  return box;
}

function autoField(f, label, ph){

}
function renderLine(dv, o, s, L){
  const d = L.data;

      <label><span>Marge %</span><input data-p="marge" inputmode="decimal" class="num" value="${esc(d.marge)}" placeholder="${fmtQ(margeDef())}"></label>
      ${autoField("mqty","Qté pose","à saisir")}

      ${autoField("mpu","Prix pose HT €","à saisir")}
      <div class="sums num"><div><span>Matériaux</span><b data-mat></b></div><div><span>Main-d’œuvre</span><b data-mo></b></div><div class="t"><span>Total</span><b data-tot></b></div></div>
    </div></div>`);
  $(".x", row).addEventListener("click", () => {
    if(L.data.custom && !d.off){ // poste ajouté à la main : retiré = supprimé
      confirmBox(`Supprimer le poste « ${d.label} » ?`, "Supprimer", () => { o.sec[s.key] = o.sec[s.key].filter(x=>x!==d); touch(dv); render(); });

    }

    row.classList.toggle("off", d.off); $(".x",row).textContent = d.off?"↺":"✕"; $(".x",row).title = d.off?"Remettre ce poste":"Retirer ce poste";

  $(".rf", row).addEventListener("input", e => { d.ref = e.target.value; touch(dv); recalc(e.target); });
  const F = {};

    rs.addEventListener("click", () => { d[f] = ""; touch(dv); recalc(); });
  });
  $$("[data-u]", row).forEach(sel => sel.addEventListener("change", () => { const k = sel.dataset.u; d[k] = sel.value; d[k+"Set"] = true; touch(dv); recalc(); }));
  $$("[data-b]", row).forEach(sel => sel.addEventListener("change", () => { d[sel.dataset.b] = sel.value; touch(dv); recalc(); }));
  $$("[data-p]", row).forEach(inp => inp.addEventListener("input", () => { d[inp.dataset.p] = inp.value; touch(dv); recalc(); }));
  REG.push({type:"line", o, s, L, row, F, unitSel:$("[data-u=unit]",row), munitSel:$("[data-u=munit]",row),
    bw:{base:$("[data-bw=base]",row), mbase:$("[data-bw=mbase]",row)}, bs:{base:$("[data-b=base]",row), mbase:$("[data-b=mbase]",row)},
    kgi:$(".kginfo",row), mat:$("[data-mat]",row), mo:$("[data-mo]",row), tot:$("[data-tot]",row), lab:$("[data-lab]",row)});
  return row;
}
function showAuto(fld, manualVal, autoVal, focusEl){
  if(fld.inp !== focusEl && document.activeElement !== fld.inp) fld.inp.value = has(manualVal) ? manualVal : (autoVal!==null ? fmtQ(autoVal) : "");
  fld.inp.classList.toggle("auto", !has(manualVal) && autoVal!==null);
  fld.rs.hidden = !(has(manualVal) && autoVal!==null);
}
function showBase(r, k, aq){
  const on = !!(aq && aq.src && aq.options && aq.options.length > 1);
  r.bw[k].hidden = !on; if(!on) return;
  const sel = r.bs[k], sig = aq.options.map(x=>x[0]).join(",");
  if(sel.dataset.sig !== sig){ sel.innerHTML = aq.options.map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join(""); sel.dataset.sig = sig; }
  sel.value = aq.src;
}
function recalc(focusEl){
  const dv = curDevis(); if(!dv) return;
  const Qs = new Map();
  dv.ouvrages.forEach(o => Qs.set(o.id, quantities(o)));
  const secTot = new Map(), ouvTot = new Map();
  REG.filter(r=>r.type==="line").forEach(r => {
    const Q = Qs.get(r.o.id), c = lineCalc(r.L, Q), d = r.L.data;
    if(r.lab) r.lab.textContent = lineLabel(r.L);
    showAuto(r.F.qty, d.qty, c.auto, focusEl);
    showAuto(r.F.pu, d.pu, c.puAuto, focusEl);
    showAuto(r.F.mqty, d.mqty, c.mqAuto, focusEl);
    showAuto(r.F.mpu, d.mpu, c.mpuAuto, focusEl);
    if(document.activeElement !== r.unitSel) r.unitSel.value = c.unit;
    if(document.activeElement !== r.munitSel) r.munitSel.value = c.munit;
    showBase(r, "base", c.aq); showBase(r, "mbase", c.munit===c.unit ? null : c.mq);
    if(c.aq && c.aq.kg){ r.kgi.hidden = false; r.kgi.textContent = c.aq.kg.p.name + " : " + fmtQ(c.aq.kg.p.kgm) + " kg/m × " + fmtQ(c.aq.kg.ml) + " ml" + (has((S("prixKg")||{})[c.aq.kg.p.fam]) && !has(d.pu) ? " · prix " + c.aq.kg.p.fam + " au kg" : ""); }
    else if(c.unit==="kg" && MLKEY[d.tpl]){ r.kgi.hidden = false; r.kgi.textContent = "Indiquez le profilé en référence (ex. HEA 200) pour calculer le poids."; }
    else r.kgi.hidden = true;
    r.mat.textContent = d.off ? "—" : eur(c.mat);
    r.mo.textContent = d.off ? "—" : eur(c.mo);
    r.tot.textContent = d.off ? "retiré" : eur(c.total);
    const sk = r.o.id + "|" + r.s.key;
    secTot.set(sk, (secTot.get(sk)||0) + c.total);
    const ot = ouvTot.get(r.o.id) || {t:0,m:0,w:0}; ot.t += c.total; ot.m += c.mat; ot.w += c.mo; ouvTot.set(r.o.id, ot);
  });
  REG.filter(r=>r.type==="sec").forEach(r => { $("[data-stot]", r.box).textContent = eur(secTot.get(r.o.id+"|"+r.s.key)||0); });
  REG.filter(r=>r.type==="ouv").forEach(r => {
    const ot = ouvTot.get(r.o.id) || {t:0,m:0,w:0};
    $("[data-sub]", r.card).textContent = eur(ot.t);
    $("[data-subd]", r.card).textContent = "Matériaux " + eur(ot.m) + " · Main-d’œuvre " + eur(ot.w);
    const qi = $("[data-qinfo]", r.card), Q = Qs.get(r.o.id), T = TYPES[r.o.type];
    if(!qi) return;
    let parts = [];
    if(T.geo==="bat"){
      parts.push("Emprise "+fmtQ(Q.emprise)+" m²");
      if(T.sections.includes("couverture")) parts.push("Couverture "+fmtQ(Q.couv)+" m²");
      if(T.sections.includes("bardage")) parts.push("Bardage "+fmtQ(Q.bardNet)+" m²"+(Q.sOuv?" (ouvertures déduites : "+fmtQ(Q.sOuv)+" m²)":""));
      if(r.o.d.toit!=="plat") parts.push("Pente "+fmtQ(Q.pente)+" %");
      if(r.o.d.toit==="2p") parts.push("Hauteur au faîtage "+fmtQ(Q.Hhigh)+" m");
      if(T.sections.includes("ossature")) parts.push(Q.nbPortiques+" portiques · "+Q.nbPoteaux+" poteaux · "+Q.nbLignesPannes+" lignes de pannes · "+Q.nbLignesLisses+" lignes de lisses par façade");
      if(T.sections.includes("couverture")) parts.push("Couverture : "+(Q.nbPans>1?Q.nbPans+" × ":"")+Q.plaquesCouvParPan+" plaques de "+fmtQ(Q.longPlaqueCouv)+" m, vis ≈ "+Q.visCouv);
      if(T.sections.includes("bardage")) parts.push("Bardage : "+Q.plaquesBard+" plaques, vis ≈ "+Q.visBard);
    } else if(T.geo==="boite") parts.push("Murs "+fmtQ(Q.froidMurs)+" m² · Plafond "+fmtQ(Q.froidPlafond)+" m²");
    else if(T.geo==="plan") parts.push("Surface "+fmtQ(Q.emprise)+" m²");
    else if(T.geo==="lin") parts.push("Longueur "+fmtQ(Q.gcL)+" ml");
    else if(T.geo==="cloture") parts.push("Clôture "+fmtQ(Q.clotL)+" ml");
    qi.textContent = parts.join(" · ");
  });
  const t = devisTotals(dv);
  const g = $("#grandHT"); if(g) g.textContent = eur(t.ht);
  const l1 = $("#matLine"); if(l1){ l1.textContent = "Matériaux " + eur(t.mat) + " · Main-d’œuvre " + eur(t.mo) + " · Bénéfice " + fmtQ(t.pct) + " %"; l1.style.color = (t.ht && t.pct < num(S("margeMin"))) ? "var(--danger)" : ""; }
  const l2 = $("#ttcLine"); if(l2) l2.textContent = "TTC " + eur(t.ttc) + (Object.keys(t.options).length ? " · options en plus" : "") + (t.missing ? " · " + t.missing + " prix à demander" : "");
}

const CAT_EXTRA = {
  couverture:[["Fumidôme / exutoire","u"]],
  ouvertures:Object.values(OUV_TYPES).map(l=>[l,"u"]).concat([["Habillages autour des ouvertures","ml"]]),
  tubes:DATALISTS.tubes.map(t => [t,"ml"]),
  hauvent:[["Ossature hauvent","m²"],["Couverture hauvent","m²"],["Rives hauvent","ml"],["Gouttière hauvent","ml"],["Solin / raccord au bâtiment","ml"]]
};
function catItems(g){
  const seen = new Set(), out = [];
  const push = (label, unit, custom) => { if(seen.has(label)) return; seen.add(label); out.push({label, unit, custom, key:g+"|"+label}); };
  (TPL[g] ? TPL[g].lines : []).forEach(t => push(t[0], t[1], false));
  (CAT_EXTRA[g] || []).forEach(t => push(t[0], t[1], false));
  (DB.lib.custom[g] || []).forEach(x => push(x.label, x.unit, true));
  return out;
}

function fournModal(it){

  const box = el(`<div><p class="muted small" style="margin:0 0 8px">Notez les prix de chaque fournisseur pour ce poste (${esc(cur.unit||it.unit)}). « Retenir » reprend ce prix dans la liste et donc dans les devis.</p><div data-fl></div>

  const draw = () => {
    const min = Math.min(...cur.fourn.map(f => num(f.prix)).filter(v => v>0));
    $("[data-fl]", box).innerHTML = cur.fourn.length ? cur.fourn.map((f,i) => `<div class="frow"><span><b>${esc(f.nom)}</b>${num(f.prix)===min?' <span class="ok small">le moins cher</span>':""}<br><span class="muted small">${frDate(f.date)}${daysSince(f.date)>90?" · plus de 3 mois":""}</span></span><span class="num">${eur(num(f.prix))}</span><button class="btn sm${cur.fournRetenu===f.nom && num(cur.pu)===num(f.prix)?" primary":""}" type="button" data-r="${i}">Retenir</button><button class="x" type="button" data-x="${i}" aria-label="Supprimer">✕</button></div>`).join("") : '<p class="muted small">Aucun fournisseur noté pour ce poste.</p>';
  };
  box.addEventListener("click", e => {
    const r = e.target.dataset.r, x = e.target.dataset.x;
    if(r!==undefined){ const f = cur.fourn[+r]; cur.pu = String(f.prix); cur.puDate = f.date || today(); cur.fournRetenu = f.nom; saveNow(); draw(); toast("Prix de " + f.nom + " retenu"); }

function rentaHtml(t){
  const min = num(S("margeMin")), low = t.ht && t.pct < min;

function backupBanner(main){

/* Script du fichier check-list autonome (sérialisé tel quel dans le fichier téléchargé) */
function checklistRuntime(){
  var DATA = window.CL_DATA, KEY = window.CL_KEY;
  var st; try{ st = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!st || !st.sections) st = JSON.parse(JSON.stringify(DATA));
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} var d=new Date(); document.getElementById("ss").textContent = "Enregistré à " + String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function render(){
    var root = document.getElementById("secs"); root.innerHTML = "";
    st.sections.forEach(function(s){
      var box = document.createElement("section"); box.className = "sec" + (s.closed ? " closed" : "");
      box.innerHTML = '<div class="h"><span class="t">'+esc(s.title)+'</span><span class="pb"><i></i></span><span class="pc"></span><span class="cv">▾</span></div><div class="b"><div class="its"></div><div class="add"><input placeholder="Nouveau point"><button type="button">Ajouter</button></div><textarea class="sn" rows="1" placeholder="Note de section">'+esc(s.note||"")+'</textarea></div>';
      var its = box.querySelector(".its");
      function upd(){ var n=s.items.length, d=s.items.filter(function(i){return i.done;}).length; box.querySelector(".pb i").style.width=(n?d/n*100:0)+"%"; var pc=box.querySelector(".pc"); pc.textContent=d+"/"+n; pc.className="pc"+(n&&d===n?" ok":""); }
      function item(it){
        var r = document.createElement("div"); r.className = "it" + (it.done ? " done" : "");
        r.innerHTML = '<div class="r"><input type="checkbox" '+(it.done?"checked":"")+'><span class="l">'+esc(it.label)+'</span><button type="button" class="ic'+(it.note?" has":"")+'">✎</button><button type="button" class="ic">✕</button></div><textarea rows="1" placeholder="Note" '+(it.note?"":"hidden")+'>'+esc(it.note||"")+'</textarea>';
        var cb=r.querySelector("input"), bt=r.querySelectorAll(".ic"), ta=r.querySelector("textarea");
        cb.addEventListener("change", function(){ it.done=cb.checked; r.classList.toggle("done",it.done); upd(); save(); });
        r.querySelector(".l").addEventListener("click", function(){ cb.click(); });
        bt[0].addEventListener("click", function(){ ta.hidden=!ta.hidden; if(!ta.hidden) ta.focus(); });
        ta.addEventListener("input", function(){ it.note=ta.value; bt[0].classList.toggle("has",!!it.note); save(); });
        bt[1].addEventListener("click", function(){ s.items=s.items.filter(function(x){return x!==it;}); r.remove(); upd(); save(); });
        its.appendChild(r);
      }
      s.items.forEach(item);
      var ai = box.querySelector(".add input");
      function add(){ var v=ai.value.trim(); if(!v) return; var it={id:uid(),label:v,done:false,note:""}; s.items.push(it); item(it); ai.value=""; upd(); save(); }
      box.querySelector(".add button").addEventListener("click", add);
      ai.addEventListener("keydown", function(e){ if(e.key==="Enter") add(); });
      box.querySelector(".sn").addEventListener("input", function(e){ s.note=e.target.value; save(); });
      box.querySelector(".h").addEventListener("click", function(){ s.closed=!s.closed; box.classList.toggle("closed", s.closed); save(); });
      upd(); root.appendChild(box);
    });
  }
  document.getElementById("addSec").addEventListener("click", function(){ var n = (document.getElementById("newSec").value||"").trim(); if(!n) return; st.sections.push({id:uid(),title:n,note:"",items:[]}); document.getElementById("newSec").value=""; render(); save(); });
  window.addEventListener("pagehide", save);
  render();
}

/* ================= V2 étape 2 : chantier et suivi ================= */
const MEDIA = (() => {
  let dbp = null, mem = {};
  const open = () => dbp = dbp || new Promise((res, rej) => { try{ const r = indexedDB.open("endgo_v2_media", 1); r.onupgradeneeded = () => r.result.createObjectStore("m"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } });
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction("m", mode), q = fn(t.objectStore("m")); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }));
  return {
    get: k => tx("readonly", st => st.get(k)).catch(() => mem[k]),
    put: (k, v) => tx("readwrite", st => st.put(v, k)).catch(() => { mem[k] = v; toast("Stockage des photos indisponible : exportez une sauvegarde avant de fermer"); }),
    del: k => tx("readwrite", st => st.delete(k)).catch(() => { delete mem[k]; })
  };
})();
function chOf(dv){ dv.chantier = dv.chantier || {}; const c = dv.chantier; c.heures = c.heures || []; c.photos = c.photos || []; c.croquis = c.croquis || []; c.cmd = c.cmd || {}; return c; }

function logDv(dv, txt){ dv.log = dv.log || []; dv.log.push({d:today(), t:txt}); }

/* Zone de dessin au doigt : trait libre, cotes, texte */
function drawPad(W, H, ops, opt){
  opt = opt || {};
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H; cv.className = "pad";
  const ctx = cv.getContext("2d"), st = {ops: ops || [], tool:"p", cur:null, color:"#0B1E5B"};
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width, (e.clientY-r.top)*H/r.height]; };
  const lw = opt.lw || 5, fs = opt.fs || 34;
  const head = (x, y, a) => { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 18*Math.cos(a-0.4), y - 18*Math.sin(a-0.4)); ctx.lineTo(x - 18*Math.cos(a+0.4), y - 18*Math.sin(a+0.4)); ctx.closePath(); ctx.fill(); };
  const label = (txt, x, y, ang, col) => {
    ctx.save(); ctx.translate(x, y); let a = ang; if(a > Math.PI/2 || a < -Math.PI/2) a += Math.PI; ctx.rotate(a);
    ctx.font = "700 " + fs + "px Arial"; const w = ctx.measureText(txt).width;
    ctx.fillStyle = "rgba(255,255,255,.92)"; ctx.fillRect(-w/2-6, -fs-8, w+12, fs+8);
    ctx.fillStyle = col; ctx.textAlign = "center"; ctx.fillText(txt, 0, -10); ctx.restore();
  };
  function op(o){
    ctx.strokeStyle = ctx.fillStyle = o.c || st.color; ctx.lineCap = ctx.lineJoin = "round";
    if(o.t==="p"){ ctx.lineWidth = lw; ctx.beginPath(); o.pts.forEach((q,i) => i ? ctx.lineTo(q[0],q[1]) : ctx.moveTo(q[0],q[1])); if(o.pts.length===1) ctx.lineTo(o.pts[0][0]+.1, o.pts[0][1]); ctx.stroke(); }
    if(o.t==="c"){
      const [x1,y1] = o.a, [x2,y2] = o.b, ang = Math.atan2(y2-y1, x2-x1);
      ctx.lineWidth = Math.max(3, lw*0.6); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      const px = -Math.sin(ang)*14, py = Math.cos(ang)*14;
      [[x1,y1],[x2,y2]].forEach(([x,y]) => { ctx.beginPath(); ctx.moveTo(x-px,y-py); ctx.lineTo(x+px,y+py); ctx.stroke(); });
      head(x2, y2, ang); head(x1, y1, ang+Math.PI);
      if(o.v) label(o.v, (x1+x2)/2, (y1+y2)/2, ang, o.c || st.color);
    }
    if(o.t==="x"){ ctx.font = "700 " + fs + "px Arial"; ctx.textAlign = "left"; ctx.fillText(o.s, o.p[0], o.p[1]); }
  }
  function draw(){
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
    if(opt.grid){ ctx.strokeStyle = "#E3E8F2"; ctx.lineWidth = 1; for(let x = 50; x < W; x += 50){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); } for(let y = 50; y < H; y += 50){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); } }
    if(opt.line){ ctx.strokeStyle = "#B8C0D4"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(30, H-40); ctx.lineTo(W-30, H-40); ctx.stroke(); }
    st.ops.forEach(op); if(st.cur) op(st.cur);
  }
  const snap = (a, b) => { const dx = b[0]-a[0], dy = b[1]-a[1], ang = Math.abs(Math.atan2(dy, dx)) % (Math.PI/2); if(ang < 0.14) return [b[0], a[1]]; if(ang > Math.PI/2-0.14) return Math.abs(dy) > Math.abs(dx) ? [a[0], b[1]] : [b[0], a[1]]; return b; };
  cv.addEventListener("pointerdown", e => {
    e.preventDefault(); const q = pos(e);
    if(st.tool==="x"){ askText("Texte sur le croquis", "Texte", "", t => { if(t){ st.ops.push({t:"x", p:q, s:t, c:st.color}); draw(); } }); return; }
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    st.cur = st.tool==="c" ? {t:"c", a:q, b:q, v:"", c:st.color} : {t:"p", pts:[q], c:st.color}; draw();
  });
  cv.addEventListener("pointermove", e => {
    if(!st.cur) return; e.preventDefault(); const q = pos(e);
    if(st.cur.t==="p") st.cur.pts.push(q); else st.cur.b = snap(st.cur.a, q);
    draw();
  });
  const up = () => {
    const c = st.cur; if(!c) return; st.cur = null;
    if(c.t==="p"){ st.ops.push(c); draw(); if(opt.onChange) opt.onChange(); return; }
    if(Math.hypot(c.b[0]-c.a[0], c.b[1]-c.a[1]) < 20){ draw(); return; }
    askText("Cote", "Valeur (ex. 6,50 m)", "", v => { c.v = v; st.ops.push(c); draw(); });
    draw();
  };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  draw();
  return {cv, st, draw, undo(){ st.ops.pop(); draw(); }, clear(){ st.ops.length = 0; draw(); }, png(type, q){ return cv.toDataURL(type||"image/png", q); }};
}

/* B2 : signature du client au doigt */
function signDevis(dv){
  const t = devisTotals(dv), cl = getClient(dv.clientId), ops = Object.keys(t.options).sort();
  const box = el(`<div style="display:flex;flex-direction:column;gap:10px">
    <p style="margin:0">Devis <b>${esc(dv.num)}</b>${dv.titre?" – "+esc(dv.titre):""}<br>Total <b>${eur(t.ttc)} TTC</b> (${eur(t.ht)} HT)${ops.length?"<br>Options non comprises.":""}</p>
    ${ops.length ? `<label class="f"><span>Option retenue par le client</span><select id="sgOpt"><option value="">Aucune option (devis de base)</option>${ops.map(k => `<option value="${k}">Option ${k} : + ${eur(t.options[k].ht)} HT</option>`).join("")}</select></label>` : ""}
    <label class="f"><span>Nom du signataire</span><input id="sgNom" value="${esc(cl ? [cl.prenom, cl.nom].filter(has).join(" ") : "")}"></label>
    <p class="muted small" style="margin:0">Le client signe ci-dessous avec le doigt, ce qui vaut « Bon pour accord ».</p>
    <div data-pad></div><div class="tools"><button class="btn sm" type="button" data-t="clr">Effacer</button></div></div>`);
  const pad = drawPad(900, 300, [], {lw:4, line:true});
  $("[data-pad]", box).appendChild(pad.cv);
  $("[data-t=clr]", box).addEventListener("click", () => pad.clear());
  modal("Signature du client", box, [{label:"Annuler",cls:"ghost"},{label:"Valider la signature",cls:"primary",onClick:bg => {
    if(!pad.st.ops.length){ toast("Le client doit signer dans le cadre"); return false; }
    const opt = $("#sgOpt", bg) ? $("#sgOpt", bg).value : "";
    dv.signature = {img: pad.png(), nom: $("#sgNom", bg).value.trim(), date: today(), heure: nowHM(), option: opt};
    logDv(dv, "Devis signé par " + (dv.signature.nom || "le client") + (opt ? " (option " + opt + ")" : ""));
    setStatut(dv, "Accepté"); touch(dv); render(); toast("Devis signé : statut passé à Accepté");
  }}]);
}

/* C4 : heures prévues (main-d'œuvre à l'heure ou à la journée du devis) */
function heuresPrevues(dv){
  let h = 0, hj = num(S("hJour")) || 8;
  ouvragesRetenus(dv).forEach(o => activeLines(o).lines.forEach(x => { if(x.c.munit==="h") h += x.c.mqty; if(x.c.munit==="jour") h += x.c.mqty*hj; }));
  return h;
}
function ouvragesRetenus(dv){ const opt = dv.signature && dv.signature.option; return dv.ouvrages.filter(o => !o.variant || o.variant===opt); }

/* B5 : bons de commande, regroupés par fournisseur retenu dans l'onglet Prix */
function bonsCommande(dv){
  const g = new Map();
  ouvragesRetenus(dv).forEach(o => {
    const a = activeLines(o);
    a.lines.filter(x => x.s.base!=="commun" && x.s.base!=="soustraite" && x.c.qty>0).forEach(x => {

function icsDate(iso, plus){ const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + (plus||0)); return d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0"); }
function calInfo(dv){
  const cl = getClient(dv.clientId), c = chOf(dv);
  return {titre: "Chantier " + (dv.titre || clientName(cl) || dv.num), lieu: chantierAdresse(cl), details: "Devis " + dv.num + (cl ? "\nClient : " + clientName(cl) + (cl.tel ? " – " + cl.tel : "") : "") + (c.equipe ? "\nÉquipe : " + c.equipe : "") + (c.note ? "\n" + c.note : ""), d1: c.debut, d2: c.fin || c.debut};
}
function googleCalUrl(dv){ const i = calInfo(dv); return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(i.titre) + "&dates=" + icsDate(i.d1) + "/" + icsDate(i.d2, 1) + "&details=" + encodeURIComponent(i.details) + "&location=" + encodeURIComponent(i.lieu); }
function downloadIcs(dv){
  const i = calInfo(dv), e = s => String(s).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ENDGO//Devis V2//FR","BEGIN:VEVENT","UID:" + dv.id + "@endgo","DTSTAMP:" + icsDate(today()) + "T000000Z","DTSTART;VALUE=DATE:" + icsDate(i.d1),"DTEND;VALUE=DATE:" + icsDate(i.d2, 1),"SUMMARY:" + e(i.titre),"LOCATION:" + e(i.lieu),"DESCRIPTION:" + e(i.details),"END:VEVENT","END:VCALENDAR"].join("\r\n");
  download("chantier-" + slug(dv.titre || dv.num) + ".ics", ics, "text/calendar");
}

/* C1 : photo redimensionnée avant stockage */
function readPhoto(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => { const m = 1600, k = Math.min(1, m / Math.max(img.width, img.height)); const cv = document.createElement("canvas"); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); res(cv.toDataURL("image/jpeg", 0.78)); }; img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

const TERRAINS = [["0","0 : mer, lac, bord de mer"],["II","II : rase campagne, peu d’obstacles"],["IIIa","IIIa : campagne avec haies, vergers, bâtiments isolés"],["IIIb","IIIb : zone industrielle, village, forêt"],["IV","IV : ville dense"]];
const Z0 = {"0":[0.005,1],"II":[0.05,2],"IIIa":[0.2,5],"IIIb":[0.5,9],"IV":[1,15]};
function windAt(lon, lat){
  const x = lon*100, y = lat*100;
  for(const [v, rings] of WIND){
    let c = 0;
    for(const r of rings){ let ins = false; for(let i = 0, j = r.length/2-1; i < r.length/2; j = i++){ const xi = r[2*i], yi = r[2*i+1], xj = r[2*j], yj = r[2*j+1]; if((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) ins = !ins; } if(ins) c++; }
    if(c % 2) return v;
  }
  return null;
}
function snowLoad(zone, alt, pente){
  const a = num(alt), z = zone || "A1"; let d = 0;
  if(z==="E"){ if(a>1000) d = 7*a/1000-4.8; else if(a>500) d = 3.5*a/1000-1.3; else if(a>200) d = 1.5*a/1000-0.3; }
  else { if(a>1000) d = 3.5*a/1000-2.45; else if(a>500) d = 1.5*a/1000-0.45; else if(a>200) d = a/1000-0.2; }
  const sk = (SK200[z]||.45) + Math.max(0,d), ang = Math.atan(num(pente)/100)*180/Math.PI;
  const mu = ang<=30 ? 0.8 : ang<60 ? 0.8*(60-ang)/30 : 0;
  return {sk, mu, s:mu*sk, sad:SAD[z]||0, ang};
}
function windLoad(vb, terrain, h){
  const [z0, zmin] = Z0[terrain] || Z0.IIIa, z = Math.max(zmin, num(h)||zmin);
  const kr = 0.19*Math.pow(z0/0.05, 0.07), lnz = Math.log(z/z0), cr = kr*lnz;
  const kl = 1 - 2e-4*Math.pow(Math.log10(z0)+3, 6), Iv = kl/lnz;
  const qb = 0.5*1.225*vb*vb, qp = (1+7*Iv)*0.5*1.225*Math.pow(cr*vb, 2);
  return {qb:qb/1000, qp:qp/1000, ce:qp/qb, z};
}
function siteOf(dv){
  dv.site = dv.site || {};
  const st = dv.site, cl = getClient(dv.clientId);
  if(!has(st.cp) && cl && has(cl.cp)) st.cp = cl.cp;
  if(!has(st.ville) && cl && has(cl.ville)) st.ville = cl.ville;
  if(!st.terrain) st.terrain = "IIIa";
  return st;
}
function depOf(cp){ const c = String(cp||"").replace(/\s/g,""); if(!/^\d{5}$/.test(c)) return ""; if(c.startsWith("20")) return +c < 20200 ? "2A" : "2B"; return c.slice(0,2); }
function siteLoads(dv, o){
  const st = siteOf(dv), Q = quantities(o), dep = st.dep || depOf(st.cp);
  const zn = st.zoneN || ((NEIGE_DEP[dep]||"").split(" ")[0]) || "";
  const vb = num(st.vb0) || null;
  return {st, dep, zn, vb, snow: zn ? snowLoad(zn, st.alt, Q.pente) : null, wind: vb ? windLoad(vb, st.terrain, Q.Hhigh) : null, Q};
}

/* E6 : neige et vent */
function toolNV(dv, o){
  const st = siteOf(dv);
  const box = el(`<div style="display:flex;flex-direction:column;gap:10px">
    <p class="muted small" style="margin:0">Pour le chantier du devis ${esc(dv.num)} (valable pour tous ses ouvrages).</p>

    <div class="row"><button class="btn sm blue" type="button" data-b="geo">Trouver la commune (internet)</button><button class="btn sm" type="button" data-b="gps">Ma position GPS</button><span class="small muted" data-msg></span></div>
    <div class="grid"><label class="f"><span>Zone de neige</span><select data-s="zoneN"></select></label><label class="f"><span>Région de vent</span><select data-s="vb0">${opts([["","À choisir"],["22","Région 1 (22 m/s)"],["24","Région 2 (24 m/s)"],["26","Région 3 (26 m/s)"],["28","Région 4 (28 m/s)"]], st.vb0||"")}</select></label><label class="f wide"><span>Rugosité du terrain autour</span><select data-s="terrain">${opts(TERRAINS, st.terrain)}</select></label></div>

    <p class="muted small" style="margin:0">Zonage du vent : AREP, EC1_GeoJSON, Licence Ouverte 2.0, d’après NF EN 1991-1-4/NA (2008).</p></div>`);

  const fillZ = () => { const dep = st.dep || depOf(st.cp), prop = (NEIGE_DEP[dep]||"").split(" ").filter(Boolean); if(!has(st.zoneN) && prop.length) st.zoneN = prop[0];
    zsel.innerHTML = opts([["","À choisir"]].concat(Object.keys(SK200).map(z => [z, z + (prop.includes(z) ? " (proposée pour le " + dep + ")" : "")])), st.zoneN||""); };

      ${x.snow ? `<tr><td>Neige au sol s<sub>k</sub> (zone ${esc(x.zn)}, ${fmtQ(num(st.alt))} m)</td><td class="r"><b>${fmtQ(x.snow.sk)} kN/m²</b></td></tr><tr><td>Neige sur la toiture (μ = ${fmtQ(x.snow.mu)}, pente ${fmtQ(Math.round(x.snow.ang))}°)</td><td class="r"><b>${fmtQ(x.snow.s)} kN/m²</b> (${fmtQ(Math.round(x.snow.s*100))} daN/m²)</td></tr>${x.snow.sad?`<tr><td>Neige exceptionnelle s<sub>Ad</sub></td><td class="r">${fmtQ(x.snow.sad)} kN/m²</td></tr>`:""}` : `<tr><td colspan="2" class="muted">Choisissez la zone de neige.</td></tr>`}
      ${x.wind ? `<tr><td>Vent de base v<sub>b,0</sub></td><td class="r">${x.vb} m/s · q<sub>b</sub> ${fmtQ(Math.round(x.wind.qb*1000))} Pa</td></tr><tr><td>Pression de pointe q<sub>p</sub> à ${fmtQ(x.wind.z)} m</td><td class="r"><b>${fmtQ(x.wind.qp)} kN/m²</b> (${fmtQ(Math.round(x.wind.qp*100))} daN/m²)</td></tr>` : `<tr><td colspan="2" class="muted">Choisissez la région de vent.</td></tr>`}</table>`;
  };
  $$("[data-s]", box).forEach(i => i.addEventListener(i.tagName==="SELECT"?"change":"input", () => { st[i.dataset.s] = i.value; if(i.dataset.s==="cp"){ st.dep = ""; st.zoneN = ""; fillZ(); } touch(dv); draw(); }));
  const msg = t => $("[data-msg]", box).textContent = t;
  const fromPoint = async (lon, lat) => {
    st.lon = lon; st.lat = lat; const v = windAt(lon, lat); if(v){ st.vb0 = String(v); $("[data-s=vb0]", box).value = st.vb0; }

    msg("Recherche…");

      const q = [st.cp, st.ville].filter(has).join(" "); if(!q){ msg("Indiquez le code postal ou la commune"); return; }
      const r = await fetch("https://api-adresse.data.gouv.fr/search/?type=municipality&limit=1&q=" + encodeURIComponent(q)); const j = await r.json(); const f = j.features && j.features[0];
      if(!f){ msg("Commune introuvable"); return; }
      st.ville = f.properties.city || f.properties.name; st.cp = f.properties.postcode || st.cp; st.dep = String(f.properties.context||"").split(",")[0].trim(); st.zoneN = "";

function pick(fam, ok){ const k = Object.keys(SEC[fam]).map(Number).sort((a,b)=>a-b).find(h => ok(...SEC[fam][h])); return k ? fam + " " + k : null; }
function predim(dv, o, G, fy, Sov){
  const x = siteLoads(dv, o), Q = x.Q, d = o.d;
  const S = has(Sov) ? num(Sov) : (x.snow ? x.snow.s : 0), W = x.wind ? x.wind.qp : 0;
  const eP = num(d.entPort)||6, ePa = num(d.entPannes)||1.5, l = Q.l, H = Q.Hhigh, E = 210000;
  const elu = 1.35*G + 1.5*S, els = G + S;
  const Ireq = (q, Lm) => 5*q*Math.pow(Lm*1000,3)*200/(384*E)/1e4;
  // pannes : poutre sur deux appuis de portée l'entraxe des portiques
  const qp1 = elu*ePa, Mp = qp1*eP*eP/8, Wp = Mp*1000/fy, Ip = Ireq(els*ePa, eP);
  const panne = pick("IPE", (I,Wy) => Wy>=Wp && I>=Ip);
  // traverse de portique à jarrets rigides : M ≈ ql²/10, flèche avec coefficient 3/384 au lieu de 5/384, poids propre forfaitaire 0,5 kN/m
  const qt = elu*eP + 1.35*0.5, Mt = qt*l*l/10, Wt = Mt*1000/fy, It = Ireq(els*eP + 0.5, l)*3/5;
  const trav = pick("IPE", (I,Wy) => Wy>=Wt && I>=It);
  // poteau : effort normal + vent sur la façade (articulé en pied, tenu en tête) + moment de jarret ql²/16, flambement forfaitaire χ = 0,5
  const N = qt*l/2, wv = 1.5*W*0.8*eP, Mv = wv*H*H/8, Mj = qt*l*l/16, Mpo = Mv + Mj;
  const pot = pick("HEA", (I,Wy,A) => N*1000/(0.5*A*100*fy) + Mpo*1e6/(Wy*1000*fy) <= 1);
  return {S, W, G, fy, elu, eP, ePa, l, H, panne, Mp, Wp, Ip, trav, Mt, Wt, It, pot, N, Mv, Mj, snowAuto:!has(Sov) && !!x.snow, windAuto:!!x.wind};
}

/* Métallerie : tubes coupés dans des barres du commerce */
function tubeCalc(x){
  const bar = num(x.bar) || 6, kerf = has(x.kerf) ? num(x.kerf)/1000 : 0.003;
  const pieces = (x.pieces||[]).map(p => [num(p[0]), Math.round(num(p[1]))]).filter(p => p[0] > 0 && p[1] > 0);
  if(pieces.length){
    const r = cutPlan(pieces, bar, kerf), long = r.tooLong.reduce((a,v) => a+v, 0);
    const nb = r.bars.length + r.tooLong.reduce((a,v) => a + Math.ceil(v/bar), 0), ml = r.used + long, bought = nb*bar;
    return {ml, nb, bar, bought, waste: ml ? (bought-ml)/ml*100 : 0, plan:r, pieces:true};
  }
  const ml = num(x.ml), nb = ml ? Math.ceil(ml/bar - 1e-9) : 0;
  return {ml, nb, bar, bought:nb*bar, waste: ml ? (nb*bar-ml)/ml*100 : 0, plan:null, pieces:false};
}
function tubeSync(o, x){
  const t = tubeCalc(x), d = dynData(o, "tube_"+x.id, {unit:"ml"});
  d.chute = t.ml ? String(Math.round(t.waste*10)/10).replace(".", ",") : "";
  if(has(x.sec) && !DATALISTS.tubes.includes(x.sec.trim())){ const g = DB.lib.custom.tubes = DB.lib.custom.tubes || []; if(!g.some(y => y.label===x.sec.trim())) g.push({label:x.sec.trim(), unit:"ml"}); }
  return t;
}

/* C6 : optimisation des débits (barres du commerce) */
function autoPieces(o, kind){
  const Q = quantities(o), d = o.d, n = Q.nbPortiques, tr = Math.max(1, n-1), lt = Q.L/tr, mono = d.toit==="1p"||d.toit==="1ph";
  const ramp = Q.l*Math.sqrt(1+Math.pow(Q.pente/100,2));
  if(kind==="Poteaux") return mono ? [[Q.Hlow, n],[Q.Hhigh, n]] : [[Q.Hlow, 2*n]];
  if(kind==="Traverses / arbalétriers") return d.toit==="2p" ? [[ramp/2, 2*n]] : [[ramp, n]];
  if(kind==="Pannes") return [[lt, Q.nbLignesPannes*tr]];
  if(kind==="Lisses de bardage") return [[lt, Q.nbLignesLisses*2*tr],[Q.l, Q.nbLignesLisses*2]];
  return [];
}
function cutPlan(pieces, bar, kerf){
  const list = []; pieces.forEach(([len, q]) => { for(let i = 0; i < q; i++) list.push(len); });
  list.sort((a,b) => b-a);
  const bars = [], tooLong = [];
  list.forEach(len => {
    if(len > bar){ tooLong.push(len); return; }
    let best = null, bestRest = Infinity;
    bars.forEach(b => { const rest = b.rest - len - (b.cuts.length ? kerf : 0); if(rest >= -1e-9 && rest < bestRest){ best = b; bestRest = rest; } });
    if(best){ best.rest = bestRest; best.cuts.push(len); } else bars.push({rest:bar-len, cuts:[len]});
  });
  const used = list.filter(l => l <= bar).reduce((a,x) => a+x, 0), bought = bars.length*bar;
  return {bar, bars, tooLong, used, bought, waste: bought ? (bought-used)/used*100 : 0};
}

  };
  $("[data-k]", box).addEventListener("change", e => { c.dk = e.target.value; pieces = e.target.value==="libre" ? [] : autoPieces(o, c.dk).map(([l,q]) => [Math.round(l*100)/100, q]).filter(x => x[1]>0); touch(dv); drawP(); calc(); });

  drawP(); calc();

/* ---------- Vue 2 : écorché de l’ossature ---------- */
function schEco(P, M){

        if(j < nb){ const y2 = bys[j+1]; if(M.zRoof(y2) - M.zBas(y2) > 0.2 || zt - zb > 0.2){ seg([x, y, zb], [x, y2, M.zRoof(y2)], 2.5, "treillis"); seg([x, y, zt], [x, y2, M.zBas(y2)], 2.5, "treillis"); } } });

  // pannes

  // lisses des long pans et pignons

  lis.forEach(z => { if(z < P.hA - 0.2) seg([0, -0.02, z], [L, -0.02, z], 4.5, "lisse"); if(z < P.hB - 0.2) seg([0, l + 0.02, z], [L, l + 0.02, z], 4.5, "lisse");

  // contreventement (croix de Saint-André) dans les travées d’extrémité
  const xs = M.frames, ends = [[xs[0], xs[1]], [xs[xs.length-2], xs[xs.length-1]]];

    [0, l].forEach(y => { const z = M.zMain(y) - 0.15; seg([xa, y, 0.1], [xb, y, z], 1.4, "croix"); seg([xa, y, z], [xb, y, 0.1], 1.4, "croix"); });
    M.main.slice(0, -1).forEach((a, i) => { const b = M.main[i+1]; seg([xa, a[0], a[1]], [xb, b[0], b[1]], 1.4, "croix"); seg([xa, b[0], b[1]], [xb, a[0], a[1]], 1.4, "croix"); });

  if(!tr) M.frames.forEach(x => [0, l].forEach(y => { const z = M.zRoof(y); const dy = y === 0 ? 0.9 : -0.9; seg([x, y, z - 0.75], [x, y + dy, M.zRoof(y + dy) - 0.05], 4, "jarret"); }));

  s += glass([[0,0,0],[L,0,0],[L,0,P.hA],[0,0,P.hA]]) + glass([[0,l,0],[L,l,0],[L,l,P.hB],[0,l,P.hB]]);
  [0, L].forEach(x => { s += glass([[x,0,0],[x,l,0]].concat(M.main.map(p => [x, p[0], p[1]]).reverse())); });

  if(P.ecl > 0) M.main.slice(0, -1).forEach((a, i) => { const b = M.main[i+1], per = Math.ceil(P.ecl / (M.main.length - 1)), cnt = Math.min(per, P.ecl - i * per);
    for(let e = 0; e < cnt; e++){ const xc = L * (e+1) / (cnt+1), w = Math.min(1.2, L / (cnt+1) * 0.5), pt = (x, t) => [x, a[0] + (b[0]-a[0])*t, 0]; s += `<polygon points="${schPts([pt(xc-w/2,.12),pt(xc+w/2,.12),pt(xc+w/2,.86),pt(xc-w/2,.86)].map(T))}" fill="rgba(255,255,255,.45)" stroke="rgba(110,135,155,.5)"/>`; } });
  mem.forEach(m => { m.d = cam.depth([(m.a[0]+m.b[0])/2, (m.a[1]+m.b[1])/2, (m.a[2]+m.b[2])/2]); });
  mem.sort((a, b) => a.d - b.d);
  mem.forEach(m => { const a = T(m.a), b = T(m.b);
    if(m.kind === "croix") s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#A84B3A" stroke-width="1.6" opacity=".85"/>`;
    else s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#2A2F33" stroke-width="${m.w}" stroke-linecap="round"/><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#66717B" stroke-width="${Math.max(1, m.w * 0.32)}" stroke-linecap="round"/>`; });
  // nœuds
  M.frames.forEach(x => [0, l].forEach(y => { const p = T([x, y, M.zRoof(y) - (tr ? 0 : 0.1)]); s += `<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="#F4F4F2" stroke="#2A2F33" stroke-width="1.2"/>`; }));
  // étiquettes

  const lab = [];

}

/* ---------- Vue 3 : vue en bout, coupe sur une ferme ---------- */
function schBout(P, M){
  const W = 1400, H = 900, A = P.auvent, l = P.l, tr = P.structure === "treillis";
  const y0 = Math.min(M.yMin, 0), y1 = Math.max(M.yMax, l), zt = M.zTop;
  const mL = 240, mR = 200, top = 130, gy = H - 300;
  const s0 = Math.min((W - mL - mR) / (y1 - y0), (gy - top) / zt);
  const X = y => Math.round((mL + (W - mL - mR - (y1 - y0) * s0) / 2 + (y - y0) * s0) * 10) / 10, Z = z => Math.round((gy - z * s0) * 10) / 10;
  let s = `<rect width="${W}" height="${H}" fill="#F4F4F2"/><defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#8C8576" stroke-width="1"/></pattern><marker id="sa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1.5L10 5L0 8.5z" fill="#23282C"/></marker></defs>`;
  s += `<rect x="${X(y0) - 120}" y="${gy}" width="${X(y1) - X(y0) + 240}" height="70" fill="#E2DDD2"/><line x1="${X(y0) - 120}" y1="${gy}" x2="${X(y1) + 120}" y2="${gy}" stroke="#6E6658" stroke-width="2"/>`;
  // pignon (remplissage)
  s += `<polygon points="${X(0)},${Z(0)} ${M.main.map(p => X(p[0]) + "," + Z(p[1])).join(" ")} ${X(l)},${Z(0)}" fill="#E8EBEC"/>`;
  const pignonTxt = `<text x="${X(l*0.5)}" y="${Z(0.35)}" stroke="#E8EBEC" stroke-width="6" paint-order="stroke" text-anchor="middle" font-size="19" fill="#5A7A90">pignon ${P.toit === "2p" ? "à 2 pans" : P.toit === "plat" ? "rectangulaire" : "en trapèze rectangle"} (bardage ${P.bardage})</text>`;
  // plots béton
  [0, l].forEach(y => { s += `<rect x="${X(y) - 0.33*s0}" y="${gy}" width="${0.66*s0}" height="${0.55*s0}" fill="#E2DDD2"/><rect x="${X(y) - 0.33*s0}" y="${gy}" width="${0.66*s0}" height="${0.55*s0}" fill="url(#hatch)" stroke="#6E6658"/><line x1="${X(y)-6}" y1="${gy}" x2="${X(y)-6}" y2="${gy + 0.4*s0}" stroke="#555" stroke-dasharray="4 3"/><line x1="${X(y)+6}" y1="${gy}" x2="${X(y)+6}" y2="${gy + 0.4*s0}" stroke="#555" stroke-dasharray="4 3"/>`; });

  const nb = Math.max(4, Math.round((yb - ya) / 0.95)); for(let j = 0; j <= nb; j++) ys.push(ya + (yb - ya) * j / nb);
  const tp = M.prof.filter(p => p[0] >= ya - 1e-6 && p[0] <= yb + 1e-6);
  const col = "#363B3F", wch = Math.max(6, 0.12 * s0);
  if(tr){
    s += `<polyline points="${ys.map(y => X(y) + "," + Z(M.zBas(y))).join(" ")}" fill="none" stroke="${col}" stroke-width="${wch}"/>`;
    ys.forEach((y, j) => { const zb = M.zBas(y), ztp = M.zRoof(y); if(ztp - zb > 0.22) s += `<line x1="${X(y)}" y1="${Z(zb)}" x2="${X(y)}" y2="${Z(ztp)}" stroke="#5A6168" stroke-width="3.5"/>`;
      if(j < nb){ const y2 = ys[j+1], d1 = ztp - zb, d2 = M.zRoof(y2) - M.zBas(y2); if(d1 > 0.22 || d2 > 0.22){ s += `<line x1="${X(y)}" y1="${Z(zb)}" x2="${X(y2)}" y2="${Z(M.zRoof(y2))}" stroke="#5A6168" stroke-width="3"/>`; if(d1 > 0.22 && d2 > 0.22) s += `<line x1="${X(y)}" y1="${Z(ztp)}" x2="${X(y2)}" y2="${Z(M.zBas(y2))}" stroke="#5A6168" stroke-width="3"/>`; else { const yy = d1 > d2 ? y : y2; s += `<polygon points="${X(y)},${Z(M.zBas(y))} ${X(y2)},${Z(M.zBas(y2))} ${X(y2)},${Z(M.zRoof(y2))} ${X(y)},${Z(M.zRoof(y))}" fill="${col}" opacity="${yy === y ? 1 : 1}"/>`; } } } });

let SCH_N = 0;
function schUniq(svg){ const k = "s" + (++SCH_N) + "_"; return svg.replace(/id="([^"]+)"/g, 'id="' + k + '$1"').replace(/url\(#([^)]+)\)/g, "url(#" + k + "$1)"); }
const SCH_CACHE = new Map();
function schAll(p){
  const key = JSON.stringify(p || {}); if(SCH_CACHE.has(key)) return SCH_CACHE.get(key);
  const res = schAll0(p); SCH_CACHE.set(key, res); if(SCH_CACHE.size > 12) SCH_CACHE.delete(SCH_CACHE.keys().next().value); return res;
}
function schAll0(p){
  const P = schNorm(p); if(P.err) return P;
  const M = schModel(P);
  return {P, iso:schUniq(schIso(P, M)), eco:schUniq(schEco(P, M)), bout:schUniq(schBout(P, M))};
}
/* SVG → PNG (data URL) pour le Drive, le chat et le partage. */
function schPng(svg, w){
  return new Promise((res, rej) => {
    const img = new Image(), vb = (svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/) || [0, 1400, 1000]);
    const W = w || 1600, H = Math.round(W * vb[2] / vb[1]);
    img.onload = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); g.drawImage(img, 0, 0, W, H); res(c.toDataURL("image/png")); };
    img.onerror = () => rej(new Error("dessin impossible"));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}
